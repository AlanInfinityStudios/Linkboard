<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linkboard</title>
<meta name="description" content="An ad-free word connection game with a Board mode and an Only Connect style Wall mode.">
<meta name="theme-color" content="#F5EFE4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Linkboard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a calm cream app. Screens stack a header, then a stage that scales the board to fit. Colour comes only from the groups. */
:root {
  color-scheme: light;
  --bg: #F5EFE4;
  --bg-deep: #ECE3D3;
  --surface: #FFFCF6;
  --tray: #E9DFCD;
  --tile: #FFFFFF;
  --tile-edge: #E0D3BD;
  --ink: #2A2420;
  --muted: #8A7D6D;
  --line: rgba(70, 50, 25, .10);
  --accent: #FF5A3C;
  --accent-ink: #FFFFFF;
  --gold: #F5B42A;
  --shadow: 0 1px 0 var(--tile-edge), 0 6px 16px rgba(90, 60, 25, .08);
  --font: "Outfit", "Avenir Next", system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--font); font-size: 15px;
  background: radial-gradient(130% 70% at 50% 0%, #FBF7EF 0%, var(--bg) 60%, var(--bg-deep) 100%);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overflow: hidden;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.app {
  height: 100%; max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px;
}
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; animation: screenIn .3s ease-out; }
@keyframes screenIn { from { opacity: 0; transform: translateY(8px); } }
.scroll { overflow-y: auto; padding-bottom: 28px; gap: 22px; }

/* ---------- Brand ---------- */
.brand { display: flex; align-items: center; gap: 12px; }
.mark { display: grid; grid-template-columns: repeat(3, 11px); gap: 3px; }
.mark i { width: 11px; height: 11px; border-radius: 3.5px; background: var(--tile-edge); }
.mark i:nth-child(4) { background: #FF5A3C; } .mark i:nth-child(5) { background: #3E7BFA; } .mark i:nth-child(6) { background: #1FB57A; }
.brand h1 { margin: 0; font-size: 2rem; font-weight: 800; letter-spacing: -.02em; }
.lede { margin: -10px 0 0; color: var(--muted); font-size: 1.02rem; }
.section-label { margin: 0; font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* ---------- Mode cards (home) ---------- */
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 16px; }
.mode-card {
  border: 0; text-align: left; background: var(--surface); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px;
  box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; position: relative; overflow: hidden;
}
.mode-card:active { transform: scale(.98); }
.mode-card .art { height: 92px; border-radius: 14px; background: var(--bg); display: grid; place-items: center; }
.mode-card h2 { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: -.01em; }
.mode-card p { margin: 0; color: var(--muted); line-height: 1.45; font-size: .95rem; }
.mode-card .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; }
.progress-text { font-size: .85rem; font-weight: 600; color: var(--muted); }
.go { background: var(--ink); color: var(--surface); border-radius: 99px; padding: 8px 16px; font-weight: 600; font-size: .9rem; }
.mode-card.soon { background: transparent; box-shadow: none; border: 2px dashed var(--line); cursor: default; }
.mode-card.soon .art { background: transparent; color: var(--muted); font-size: 2rem; }
.mini { display: grid; gap: 4px; }
.mini.b { grid-template-columns: repeat(5, 18px); }
.mini.w { grid-template-columns: repeat(4, 24px); }
.mini i { height: 10px; border-radius: 3px; background: var(--tile); box-shadow: 0 1px 0 var(--tile-edge); }
.mini.w i { height: 14px; }
.mini i.c { background: var(--c); box-shadow: none; }

/* ---------- Mode screen: tracks ---------- */
.topbar { display: grid; grid-template-columns: 46px 1fr 46px; align-items: center; gap: 10px; }
.topbar h2 { margin: 0; text-align: center; font-size: 1.35rem; font-weight: 700; letter-spacing: -.01em; }
.icon-btn { width: 46px; height: 46px; border: 0; border-radius: 14px; background: var(--surface); display: grid; place-items: center; box-shadow: var(--shadow); }
.icon-btn svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 16px; }
.track { background: var(--surface); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); border-top: 5px solid var(--c); }
.track-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.track h3 { margin: 0; font-size: 1.3rem; font-weight: 700; color: var(--c); }
.track .count { font-size: .85rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 30px; height: 30px; border-radius: 9px; border: 0; background: var(--bg); color: var(--muted); font-weight: 700; font-size: .85rem; display: grid; place-items: center; }
.dot.done { background: var(--c); color: #fff; }
.dot.next { box-shadow: inset 0 0 0 2px var(--c); color: var(--c); }
.next-up { display: flex; flex-direction: column; gap: 2px; }
.next-up small { font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.next-up b { font-size: 1.1rem; font-weight: 600; }
.next-up span { font-size: .85rem; color: var(--muted); }
.play {
  border: 0; border-radius: 14px; padding: 13px 18px; font-weight: 700; font-size: 1rem; background: var(--c); color: #fff;
  box-shadow: 0 3px 0 color-mix(in srgb, var(--c) 70%, #000); display: flex; align-items: center; justify-content: center; gap: 8px;
}
.play:active { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 70%, #000); }
.wall-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.wall-chip { border: 0; border-radius: 12px; background: var(--bg); padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 700; }
.wall-chip small { font-size: .7rem; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.wall-chip.done { background: color-mix(in srgb, var(--c) 14%, var(--surface)); }
.wall-chip.saved { box-shadow: inset 0 0 0 2px var(--c); }

/* ---------- Game header ---------- */
.bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.title-block { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.title-block .lvl { font-size: 1.3rem; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
.title-block small { font-size: .74rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
.timer {
  justify-self: end; display: flex; align-items: center; gap: 8px; background: var(--surface); color: var(--ink);
  padding: 8px 14px 8px 10px; border-radius: 99px; font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; box-shadow: var(--shadow);
}
.timer svg { width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 2.4; stroke-linecap: round; }
.timer.frozen { background: #DDF0FF; }
.timer.frozen svg { stroke: #1C7ED6; }
.timer.low { color: var(--accent); animation: tick 1s steps(1) infinite; }
.timer.low svg { stroke: var(--accent); }
@keyframes tick { 50% { transform: scale(1.05); } }
.sub { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; }
.hint-text { color: var(--muted); font-size: .98rem; }
.counter { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums; background: var(--surface); border-radius: 99px; padding: 6px 14px 6px 10px; box-shadow: var(--shadow); }
.stack { position: relative; width: 22px; height: 18px; }
.stack i { position: absolute; left: 0; width: 22px; height: 8px; border-radius: 3px; }
.stack i:nth-child(1) { top: 10px; background: #1FB57A; }
.stack i:nth-child(2) { top: 5px; background: #3E7BFA; }
.stack i:nth-child(3) { top: 0; background: #FF5A3C; }

/* ---------- Board ---------- */
.stage { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; }
.board {
  width: min(100cqw, 152cqh); aspect-ratio: 1.52; background: var(--tray); border-radius: 2.4cqw; padding: 1.6%;
  box-shadow: inset 0 0.3cqw 1cqw rgba(90, 60, 25, .12);
  display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(7, 1fr); gap: 2.2% 1.6%;
  container-type: inline-size; touch-action: none; position: relative; overflow: hidden;
}
.slot { position: relative; z-index: 1; border-radius: 1.5cqw; min-width: 0; min-height: 0; }
.slot.empty { background: rgba(120, 90, 50, .08); transition: opacity .4s; }
.slot.gone { opacity: 0; }
.slot.target::after { content: ""; position: absolute; inset: -0.5cqw; border-radius: 1.9cqw; border: 0.4cqw dashed var(--accent); }
.tile {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--ink);
  background: var(--tile); border-radius: 1.5cqw; box-shadow: 0 0.25cqw 0 var(--tile-edge), 0 0.8cqw 1.6cqw rgba(90, 60, 25, .10);
  font-weight: 600; font-size: 2.2cqw; letter-spacing: .04em; text-transform: uppercase; line-height: 1.1;
  padding: 0 .4em; cursor: grab; transition: box-shadow .15s, background .3s, color .3s; overflow: hidden;
}
.tile .pic { font-size: 4.4cqw; line-height: 1; letter-spacing: 0; }
.tile.symbol { background: radial-gradient(circle at 50% 35%, #FFFFFF 0%, #FFF5E2 80%); box-shadow: 0 0.25cqw 0 #E9C98A, inset 0 0 0 0.25cqw #F5D9A2, 0 0.8cqw 1.6cqw rgba(90, 60, 25, .10); }
.tile.sel { box-shadow: 0 0 0 0.45cqw var(--accent), 0 1cqw 2cqw rgba(90, 60, 25, .18); transform: translateY(-0.4cqw); }
.tile.lifted { opacity: .2; }
.tile.grouped { color: #fff; background: var(--c); box-shadow: 0 0.25cqw 0 color-mix(in srgb, var(--c) 70%, #000); cursor: default; }
.tile.hinted { animation: hintPulse 1.1s ease-in-out infinite; }
.tile.hinted::after { content: "🔗"; position: absolute; top: .25em; right: .35em; font-size: .9em; }
@keyframes hintPulse { 0%, 100% { box-shadow: 0 0 0 0.3cqw var(--gold), 0 0.8cqw 1.6cqw rgba(90, 60, 25, .10); } 50% { box-shadow: 0 0 0 0.75cqw color-mix(in srgb, var(--gold) 55%, transparent), 0 0.8cqw 1.6cqw rgba(90, 60, 25, .10); } }
.tile.born { animation: born .6s cubic-bezier(.2, .9, .3, 1.5) both; }
@keyframes born { from { transform: scale(.2) rotate(-25deg); } }
.band {
  z-index: 0; grid-column: 1 / -1; margin: -1.25cqw -0.9cqw -0.5cqw; border-radius: 1.9cqw; position: relative;
  background: color-mix(in srgb, var(--c) 22%, var(--surface)); box-shadow: inset 0 0 0 0.25cqw color-mix(in srgb, var(--c) 55%, transparent);
}
.band span {
  position: absolute; top: 0; left: 0; right: 0; text-align: center; color: color-mix(in srgb, var(--c) 75%, #000);
  font-size: 1.3cqw; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; line-height: 1.15;
}
.band.new { animation: bandIn .35s ease-out both; }
@keyframes bandIn { from { transform: scaleX(.9); opacity: 0; } }
.ghost {
  position: fixed; z-index: 50; pointer-events: none; display: grid; place-items: center; text-align: center;
  background: var(--tile); color: var(--ink); border-radius: 12px; padding: 0 .4em; line-height: 1.1;
  box-shadow: 0 16px 34px rgba(90, 60, 25, .28), 0 0 0 3px var(--accent);
  font-family: var(--font); font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
  transform: translate(-50%, -50%) scale(1.08) rotate(-2deg);
}
.ghost .pic { line-height: 1; letter-spacing: 0; }

.tools { display: flex; justify-content: center; gap: 22px; padding-top: 4px; }
.tool-wrap { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.tool { position: relative; width: 60px; height: 60px; border: 0; border-radius: 20px; background: var(--surface); display: grid; place-items: center; font-size: 26px; box-shadow: var(--shadow); }
.tool:active { transform: scale(.94); }
.tool:disabled { opacity: .4; cursor: default; }
.tool .n { position: absolute; top: -6px; right: -6px; min-width: 24px; height: 24px; border-radius: 12px; padding: 0 7px; background: var(--accent); color: #fff; font-size: .8rem; font-weight: 700; display: grid; place-items: center; }
.tool-label { font-size: .78rem; color: var(--muted); font-weight: 600; }

/* ---------- Wall ---------- */
.wall-stage { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; }
.wall {
  width: min(100cqw, 128cqh); aspect-ratio: 1.6; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
  gap: 1.8%; container-type: inline-size; padding: 1.6%; border-radius: 2.4cqw; background: var(--tray); box-shadow: inset 0 0.3cqw 1cqw rgba(90, 60, 25, .12);
}
.wtile {
  border: 0; border-radius: 1.4cqw; color: var(--ink); background: var(--tile); box-shadow: 0 0.25cqw 0 var(--tile-edge), 0 0.8cqw 1.6cqw rgba(90, 60, 25, .10);
  font-weight: 600; font-size: 3cqw; line-height: 1.1; padding: 0 .4em; min-width: 0; transition: background .2s, color .2s, transform .12s;
}
.wtile.sel { transform: translateY(-0.4cqw); box-shadow: 0 0 0 0.45cqw var(--accent), 0 1cqw 2cqw rgba(90, 60, 25, .18); }
.wtile.found { color: #fff; background: var(--c); box-shadow: 0 0.25cqw 0 color-mix(in srgb, var(--c) 70%, #000); cursor: default; animation: pop .4s ease-out; }
.wtile.revealed { filter: saturate(.4); opacity: .8; }
@keyframes pop { 40% { transform: scale(1.07); } }
.wall.shake { animation: shake .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
.lives { display: flex; gap: 6px; align-items: center; font-weight: 600; color: var(--muted); }
.lives .heart { width: 24px; height: 24px; }
.lives .heart path { fill: var(--accent); }
.lives .heart.gone path { fill: var(--tile-edge); }

/* ---------- Overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(60, 45, 30, .35); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: grid; place-items: center; padding: 16px; animation: fade .25s; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  background: var(--surface); color: var(--ink); border-radius: 26px; padding: 24px; width: min(540px, 100%);
  max-height: calc(100% - 32px); overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 30px 70px rgba(60, 40, 20, .25); animation: rise .4s cubic-bezier(.2, .9, .3, 1.2);
}
@keyframes rise { from { transform: translateY(24px) scale(.97); opacity: 0; } }
.sheet h2 { font-weight: 800; font-size: 1.9rem; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
.sheet p { margin: 0; color: var(--muted); line-height: 1.45; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { background: var(--bg); border-radius: 14px; padding: 10px 14px; min-width: 96px; }
.stat b { display: block; font-size: 1.45rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 14px; padding: 12px 20px; font-weight: 700; background: var(--bg); color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--surface); }
.btn:active { transform: scale(.97); }
.conn { display: grid; grid-template-columns: 10px 1fr auto; gap: 4px 12px; align-items: center; background: var(--bg); border-radius: 14px; padding: 10px 12px; }
.conn .sw { grid-row: 1 / span 2; width: 10px; align-self: stretch; border-radius: 5px; background: var(--c); }
.conn .name, .conn .words { grid-column: 2; min-width: 0; }
.conn .ctl { grid-column: 3; grid-row: 1 / span 2; }
.conn .words { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.conn .name { font-weight: 700; }
.conn .name.hidden { color: var(--muted); font-weight: 500; font-style: italic; }
.pill-btn { border: 0; border-radius: 99px; padding: 8px 12px; font-size: .82rem; font-weight: 700; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.pill-btn.on { background: #1FB57A; color: #fff; }
.toast {
  position: fixed; left: 50%; top: calc(66px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 99px; font-weight: 600; z-index: 70;
  box-shadow: 0 10px 24px rgba(60, 40, 20, .25); animation: fade .2s; max-width: calc(100% - 48px); text-align: center;
}
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 65; }
@media (prefers-reduced-motion: reduce) {
  .screen, .sheet, .overlay, .tile.hinted, .timer.low { animation: none !important; }
}
@media (max-width: 600px) {
  .board { width: min(100cqw, 80cqh); aspect-ratio: .8; gap: 1.6% 1.8%; }
  .tile { font-size: 2.75cqw; letter-spacing: 0; padding: 0 .15em; }
  .tile .pic { font-size: 6.5cqw; }
  .band span { font-size: 2.3cqw; top: -0.4cqw; }
  .wall { width: min(100cqw, 100cqh); aspect-ratio: 1; }
  .wtile { font-size: 4.2cqw; }
  .tool { width: 52px; height: 52px; font-size: 22px; }
  .timer { font-size: 1rem; }
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="puzzles.js"></script>
<script>
const GROUP_COLOURS = ["#FF5A3C", "#3E7BFA", "#1FB57A", "#F5A300", "#A855F7", "#00B2C9", "#FF7A1A", "#EC4899", "#5B6CFF", "#7CB82F", "#0EA5A0", "#E8456B", "#2E86DE", "#D97706", "#6366F1", "#16A34A"];
const WALL_COLOURS = ["#3E7BFA", "#1FB57A", "#F5A300", "#FF5A3C"];
const TRACKS = [
  { key: "Easy", colour: "#1FB57A", blurb: "Gentle warm-ups, no clock" },
  { key: "Medium", colour: "#F5A300", blurb: "Trickier links, some against the clock" },
  { key: "Hard", colour: "#FF5A3C", blurb: "Red herrings and a ticking clock" },
];
const COLS = 5, ROWS = 7, SIZE = COLS * ROWS;

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const fmt = s => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function parseTile(raw) {
  const i = raw.indexOf("|");
  return i > 0 ? { pic: raw.slice(0, i), label: raw.slice(i + 1) } : { pic: null, label: raw };
}
function tileFace(t) { return t.pic ? `<span class="pic" role="img" aria-label="${esc(t.label)}">${t.pic}</span>` : esc(t.label); }
let toastTimer;
function toast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2400);
}
/* Everything the player has done is kept in this browser: finished levels, best scores and any game in progress. */
const STORE_KEY = "linkboard-v3";
const store = {
  get() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; } },
  set(k, v) { try { const d = store.get(); if (v === undefined) delete d[k]; else d[k] = v; localStorage.setItem(STORE_KEY, JSON.stringify(d)); } catch {} },
};

/* ---------- timer (shared) ---------- */
let tickHandle = null, lastTick = 0, onTick = null;
function startTicking(fn) {
  stopTicking(); onTick = fn; lastTick = performance.now();
  tickHandle = setInterval(() => { const now = performance.now(); const dt = (now - lastTick) / 1000; lastTick = now; if (!document.hidden) onTick(dt, now); }, 200);
}
function stopTicking() { clearInterval(tickHandle); tickHandle = null; }

/* ---------- confetti ---------- */
function confetti() {
  if (reduceMotion) return;
  const c = document.createElement("canvas"); c.id = "confetti"; document.body.appendChild(c);
  const ctx = c.getContext("2d"), dpr = devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const bits = Array.from({ length: 140 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .45, vx: (Math.random() - .5) * 14, vy: -Math.random() * 16 - 4,
    r: Math.random() * Math.PI, vr: (Math.random() - .5) * .4, w: 7 + Math.random() * 7, h: 4 + Math.random() * 4, col: pick(GROUP_COLOURS),
  }));
  let t = 0;
  (function frame() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    bits.forEach(b => { b.vy += .4; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.col; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.restore(); });
    if (++t < 170) requestAnimationFrame(frame); else c.remove();
  })();
}

/* =====================================================================
   BOARD MODE
   A found group shrinks into a picture only when it is part of a bigger
   answer. Groups with nothing above them stay as full-colour rows, which
   settle into a stack at the bottom of the board.
   ===================================================================== */
let B = null;

function buildLevel(level) {
  const groups = [], tiles = [];
  function addGroup(spec, parent) {
    const g = { id: groups.length, name: spec.name, pic: spec.pic || null, parent, memberTiles: [] };
    groups.push(g);
    spec.tiles.forEach(t => {
      if (typeof t === "object") g.memberTiles.push(addGroup(t, g.id));
      else { const tile = { id: tiles.length, ...parseTile(t), parent: g.id, symbolOf: null }; tiles.push(tile); g.memberTiles.push(tile.id); }
    });
    return g;
  }
  level.groups.forEach(s => addGroup(s, null));
  groups.forEach(g => {
    if (g.parent != null) { const t = { id: tiles.length, label: g.name, pic: g.pic, parent: g.parent, symbolOf: g.id }; tiles.push(t); g.symbolTile = t.id; }
  });
  groups.forEach(g => g.memberTiles = g.memberTiles.map(m => typeof m === "object" ? m.symbolTile : m));
  let ci = 0;
  groups.filter(g => g.parent == null).forEach(g => g.colour = GROUP_COLOURS[ci++ % GROUP_COLOURS.length]);
  groups.filter(g => g.parent != null).forEach(g => g.colour = GROUP_COLOURS[ci++ % GROUP_COLOURS.length]);
  return { groups, tiles };
}

function startBoard(levelIdx) {
  leaveGame();
  const level = BOARD_LEVELS[levelIdx];
  const { groups, tiles } = buildLevel(level);
  B = {
    levelIdx, level, groups, tiles, board: new Array(SIZE).fill(null), lockedList: [], solved: new Set(),
    pool: tiles.filter(t => t.symbolOf == null).map(t => t.id),
    timed: !!level.time, timeLeft: level.time || 0, elapsed: 0, frozenUntil: 0,
    hints: 3, freezes: level.time ? 2 : 0, busy: false, sel: null, completing: null, hintTiles: [], born: null, over: false,
  };
  const saved = store.get()["save-board-" + levelIdx];
  if (saved && saved.sig === tiles.length + ":" + groups.length) {
    Object.assign(B, { board: saved.board, lockedList: saved.lockedList, solved: new Set(saved.solved), pool: saved.pool,
      timeLeft: saved.timeLeft, elapsed: saved.elapsed, hints: saved.hints, freezes: saved.freezes, hintTiles: saved.hintTiles || [] });
    renderBoardScreen();
    flip(new Map(), new Set(B.board.filter(x => x != null)));
    toast("Welcome back. Carrying on where you left off.");
  } else {
    // Opening deal: the minimum number of complete word groups plus a random mix.
    const wordGroups = shuffle(groups.filter(g => g.memberTiles.every(t => tiles[t].symbolOf == null)));
    const deal = wordGroups.slice(0, MIN_ANSWERS[level.difficulty] ?? 2).flatMap(g => g.memberTiles);
    B.pool = shuffle(B.pool.filter(t => !deal.includes(t)));
    while (deal.length < SIZE && B.pool.length) deal.push(B.pool.pop());
    shuffle(deal).forEach((id, i) => B.board[i] = id);
    breakCompleteRows();
    renderBoardScreen();
    flip(new Map(), new Set(B.board.filter(x => x != null)));
  }
  saveBoard();
  startTicking(boardTick);
}

function saveBoard() {
  if (!B || B.over || B.busy) return;
  store.set("save-board-" + B.levelIdx, {
    sig: B.tiles.length + ":" + B.groups.length, board: B.board, lockedList: B.lockedList, solved: [...B.solved], pool: B.pool,
    timeLeft: B.timeLeft, elapsed: B.elapsed, hints: B.hints, freezes: B.freezes, hintTiles: B.hintTiles,
  });
}

const T = id => B.tiles[id];
const rowOf = i => Math.floor(i / COLS);
const playRows = () => ROWS - B.lockedList.length;
const lockedGroupAt = r => r >= playRows() ? B.lockedList[r - playRows()] : null;
const isLocked = i => rowOf(i) >= playRows() || (B.completing && B.completing.some(c => c.row === rowOf(i)));
function rowIds(r) { return B.board.slice(r * COLS, r * COLS + COLS); }
function rowComplete(r) {
  if (r >= playRows()) return null;
  const ids = rowIds(r);
  if (ids.some(x => x == null)) return null;
  const p = T(ids[0]).parent;
  return ids.every(x => T(x).parent === p) && !B.solved.has(p) ? p : null;
}
const playable = () => B.board.map((_, i) => i).filter(i => rowOf(i) < playRows());
function breakCompleteRows() {
  for (let guard = 0; guard < 100; guard++) {
    const r = [...Array(ROWS).keys()].find(r => rowComplete(r) != null);
    if (r == null) return;
    const a = r * COLS + Math.floor(Math.random() * COLS);
    const others = playable().filter(i => rowOf(i) !== r && B.board[i] != null && T(B.board[i]).parent !== T(B.board[a]).parent);
    if (!others.length) return;
    const b = pick(others);
    [B.board[a], B.board[b]] = [B.board[b], B.board[a]];
  }
}
// Tiles fall down each column to fill gaps, leaving any spaces at the top.
function gravity() {
  const P = playRows();
  for (let c = 0; c < COLS; c++) {
    const col = [];
    for (let r = P - 1; r >= 0; r--) if (B.board[r * COLS + c] != null) col.push(B.board[r * COLS + c]);
    for (let r = P - 1, k = 0; r >= 0; r--, k++) B.board[r * COLS + c] = col[k] ?? null;
  }
}
// How many answers the board always keeps available, by difficulty.
const MIN_ANSWERS = { Easy: 3, Medium: 3, Hard: 2 };
const minAnswers = () => MIN_ANSWERS[B.level.difficulty] ?? 2;

// Drop hidden words in from the top, keeping a minimum number of complete answers on the board.
function refill() {
  const incoming = [], keep = new Set();
  for (let guard = 0; guard < 12; guard++) {
    const on = new Set([...B.board.filter(x => x != null), ...incoming]);
    const open = B.groups.filter(g => !B.solved.has(g.id));
    const complete = open.filter(g => g.memberTiles.every(t => on.has(t)));
    complete.forEach(g => keep.add(g.id));
    if (complete.length >= minAnswers()) break;
    const inPool = new Set(B.pool);
    const missingOf = g => g.memberTiles.filter(t => !on.has(t)).length;
    const ready = open.filter(g => !keep.has(g.id) && g.memberTiles.every(t => on.has(t) || inPool.has(t)))
      .sort((x, y) => missingOf(x) - missingOf(y));
    const g = ready[0];
    if (!g) break;
    keep.add(g.id);
    const missing = g.memberTiles.filter(t => !on.has(t));
    let room = playable().filter(i => B.board[i] == null).length - incoming.length;
    // Not enough room? Quietly send some unrelated tiles back to the hidden stack.
    while (missing.length > room) {
      const others = playable().filter(i => B.board[i] != null && !keep.has(T(B.board[i]).parent));
      let cands = others.filter(i => T(B.board[i]).symbolOf == null && !B.hintTiles.includes(B.board[i]));
      if (!cands.length) cands = others;
      if (!cands.length) break;
      const i = pick(cands); B.pool.push(B.board[i]); B.board[i] = null; room++;
    }
    if (missing.length > room) break;
    incoming.push(...missing);
    B.pool = B.pool.filter(t => !missing.includes(t));
  }
  gravity();
  shuffle(B.pool);
  const empties = playable().filter(i => B.board[i] == null);
  while (incoming.length < empties.length && B.pool.length) incoming.push(B.pool.pop());
  shuffle(incoming);
  empties.sort((a, b) => b - a).forEach((slot, k) => { if (k < incoming.length) B.board[slot] = incoming[k]; });
  gravity();
  breakCompleteRows();
  return new Set(incoming);
}

/* Smooth movement: remember where tiles were, re-render, then animate each one from its old spot to its new one. */
function tileRects() {
  const m = new Map();
  document.querySelectorAll("#board .tile").forEach(el => m.set(+el.dataset.id, el.getBoundingClientRect()));
  return m;
}
function flip(before, fresh = new Set(), skip = null) {
  const board = $("#board"); if (!board || !board.animate) return;
  const top = board.getBoundingClientRect().top;
  const slow = reduceMotion ? .6 : 1;
  board.querySelectorAll(".tile").forEach(el => {
    const id = +el.dataset.id, a = el.getBoundingClientRect(), b = before.get(id);
    if (id === skip) return;
    const c = +el.dataset.i % COLS, r = rowOf(+el.dataset.i);
    if (b) {
      const dx = b.left - a.left, dy = b.top - a.top;
      if (Math.abs(dx) + Math.abs(dy) < 1) return;
      el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "translate(0, 0)" }],
        { duration: (420 + Math.min(Math.hypot(dx, dy), 500) * .6) * slow, delay: dy < 0 ? 0 : c * 30, easing: "cubic-bezier(.3, 1.12, .5, 1)", fill: "backwards" });
    } else if (fresh.has(id)) {
      const dy = -(a.bottom - top) - 12;
      el.animate([{ transform: `translateY(${dy}px)`, opacity: 0 }, { opacity: 1, offset: .2 }, { transform: "translateY(0)", opacity: 1 }],
        { duration: (650 + (a.bottom - top) * .4) * slow, delay: 250 + c * 70 + (ROWS - r) * 40, easing: "cubic-bezier(.3, 1.1, .5, 1)", fill: "backwards" });
    }
  });
}

function boardTick(dt, now) {
  if (!B || B.over) return;
  const frozen = now < B.frozenUntil;
  const t = $("#timer");
  if (B.timed) {
    if (!frozen) B.timeLeft -= dt;
    if (t) {
      t.querySelector(".t").textContent = fmt(Math.ceil(B.timeLeft));
      t.classList.toggle("frozen", frozen);
      t.classList.toggle("low", !frozen && B.timeLeft <= 30);
    }
    if (B.timeLeft <= 0) endBoard(false);
  } else {
    B.elapsed += dt;
    if (t) t.querySelector(".t").textContent = fmt(B.elapsed);
  }
  if ((B.saveTick = (B.saveTick || 0) + dt) > 3) { B.saveTick = 0; saveBoard(); }
}

function renderBoardScreen() {
  const L = B.level, track = TRACKS.find(t => t.key === L.difficulty) || TRACKS[0];
  const num = levelsIn(L.difficulty).findIndex(l => l.idx === B.levelIdx) + 1;
  app.innerHTML = `
  <div class="screen">
    <div class="bar">
      <button class="icon-btn" id="back" aria-label="Back to levels">${ICONS.back}</button>
      <div class="title-block" style="--c:${track.colour}"><div class="lvl">${esc(L.name)}</div><small>${esc(L.difficulty)} · Level ${num}</small></div>
      <div class="timer" id="timer" aria-label="${B.timed ? "Time left" : "Time taken"}">${ICONS.clock}<span class="t">${fmt(B.timed ? B.timeLeft : B.elapsed)}</span></div>
    </div>
    <div class="sub">
      <span class="hint-text">Put five connected tiles in one row</span>
      <span class="counter" aria-label="Groups found"><span class="stack"><i></i><i></i><i></i></span><span id="count"></span></span>
    </div>
    <div class="stage"><div class="board" id="board"></div></div>
    <div class="tools">
      <div class="tool-wrap"><button class="tool" id="hintBtn" aria-label="Hint: show two tiles that connect">💡<span class="n" id="hintN"></span></button><span class="tool-label">Hint</span></div>
      ${B.timed ? `<div class="tool-wrap"><button class="tool" id="freezeBtn" aria-label="Freeze the clock for 30 seconds">❄️<span class="n" id="freezeN"></span></button><span class="tool-label">Freeze</span></div>` : ""}
      <div class="tool-wrap"><button class="tool" id="shuffleBtn" aria-label="Shuffle the board">🔀</button><span class="tool-label">Shuffle</span></div>
    </div>
  </div>`;
  $("#back").onclick = () => { saveBoard(); showBoardMode(); };
  $("#hintBtn").onclick = useHint;
  if (B.timed) $("#freezeBtn").onclick = useFreeze;
  $("#shuffleBtn").onclick = () => {
    if (B.busy || B.over) return;
    const before = tileRects();
    const slots = playable().filter(i => B.board[i] != null);
    const ids = shuffle(slots.map(i => B.board[i]));
    slots.forEach((s, k) => B.board[s] = ids[k]);
    breakCompleteRows(); B.sel = null;
    renderBoard(); flip(before); saveBoard();
  };
  bindDrag($("#board"));
  renderBoard();
}

function renderBoard() {
  const el = $("#board"); if (!el) return;
  let html = "";
  const bandRows = new Map();
  for (let r = playRows(); r < ROWS; r++) bandRows.set(r, lockedGroupAt(r));
  (B.completing || []).forEach(c => bandRows.set(c.row, c.group));
  bandRows.forEach((gid, row) => {
    const g = B.groups[gid];
    const isNew = B.completing && B.completing.some(c => c.row === row);
    html += `<div class="band ${isNew ? "new" : ""}" style="grid-row:${row + 1};--c:${g.colour}"><span>${esc(g.name)}</span></div>`;
  });
  // Rows that have emptied completely (once the hidden words run out) disappear, so the board shrinks from the top.
  let emptyTop = 0;
  while (emptyTop < playRows() && rowIds(emptyTop).every(x => x == null)) emptyTop++;
  for (let i = 0; i < SIZE; i++) {
    const id = B.board[i], r = rowOf(i), c = i % COLS;
    const pos = `grid-row:${r + 1};grid-column:${c + 1}`;
    if (id == null) { html += `<div class="slot empty ${r < emptyTop ? "gone" : ""}" data-i="${i}" style="${pos}"></div>`; continue; }
    const t = T(id);
    const cls = [];
    let style = "";
    if (t.symbolOf != null) cls.push("symbol");
    if (B.sel === i) cls.push("sel");
    if (bandRows.has(r)) { cls.push("grouped"); style = `--c:${B.groups[bandRows.get(r)].colour}`; }
    else if (B.hintTiles.includes(id)) cls.push("hinted");
    if (B.born === id) cls.push("born");
    html += `<div class="slot" data-i="${i}" style="${pos}"><div class="tile ${cls.join(" ")}" style="${style}" data-i="${i}" data-id="${id}" tabindex="0" aria-label="${esc(t.label)}">${tileFace(t)}</div></div>`;
  }
  el.innerHTML = html;
  B.born = null;
  $("#count").textContent = `${B.solved.size}/${B.groups.length}`;
  $("#hintN").textContent = B.hints; $("#hintBtn").disabled = !B.hints;
  if (B.timed) { $("#freezeN").textContent = B.freezes; $("#freezeBtn").disabled = !B.freezes; }
}

function swapSlots(a, b, dragged = false) {
  if (a === b || B.busy || B.over || isLocked(a) || isLocked(b)) return;
  const before = tileRects();
  const movedId = B.board[a];
  [B.board[a], B.board[b]] = [B.board[b], B.board[a]];
  B.sel = null;
  // Moving a tile into a gap leaves a hole behind; let everything above it fall.
  if (B.board[a] == null || B.board[b] == null) gravity();
  const done = [];
  for (let r = 0; r < playRows(); r++) { const g = rowComplete(r); if (g != null) done.push({ row: r, group: g }); }
  if (done.length) {
    B.busy = true; B.completing = done;
    const found = new Set(done.map(d => d.group));
    if (B.hintTiles.some(t => found.has(T(t).parent))) B.hintTiles = [];
  }
  renderBoard();
  flip(before, new Set(), dragged ? movedId : null);
  if (!done.length) return saveBoard();
  const cur = B;
  setTimeout(() => { if (B === cur) resolveRows(done); }, 1000);
}

function resolveRows(done) {
  const subs = done.filter(d => B.groups[d.group].parent != null);
  const SQUISH = reduceMotion ? 500 : 900;
  // Groups that belong to a bigger answer: the five tiles slide together, then shrink into the picture.
  subs.forEach(d => {
    for (let c = 0; c < COLS; c++) {
      const tile = $(`#board .tile[data-i="${d.row * COLS + c}"]`);
      if (!tile) continue;
      tile.animate([
        { transform: "translateX(0) scale(1)", opacity: 1 },
        { transform: `translateX(${(2 - c) * 104}%) scale(1)`, opacity: 1, offset: .6 },
        { transform: `translateX(${(2 - c) * 104}%) scale(.1)`, opacity: 0 },
      ], { duration: SQUISH, easing: "cubic-bezier(.45, 0, .25, 1)", fill: "forwards" });
    }
    const band = $(`#board .band[style*="grid-row:${d.row + 1};"]`);
    if (band) band.animate([{ opacity: 1 }, { opacity: 1, offset: .6 }, { opacity: 0 }], { duration: SQUISH, fill: "forwards" });
  });
  const cur = B;
  setTimeout(() => {
    if (B !== cur) return;
    const before = tileRects();
    const tops = done.filter(d => B.groups[d.group].parent == null).sort((a, b) => a.row - b.row);
    subs.forEach(d => {
      const g = B.groups[d.group];
      B.solved.add(g.id);
      for (let c = 0; c < COLS; c++) B.board[d.row * COLS + c] = null;
      B.board[d.row * COLS + 2] = g.symbolTile;
      B.born = g.symbolTile;
      toast(`${g.pic} ${g.name}`);
    });
    if (tops.length) {
      // Finished groups with nothing above them settle at the bottom as full-colour rows.
      const P = playRows();
      const rows = [...Array(ROWS).keys()].map(rowIds);
      const topRows = new Set(tops.map(d => d.row));
      const keep = rows.slice(0, P).filter((_, r) => !topRows.has(r));
      tops.forEach(d => B.solved.add(d.group));
      B.lockedList = [...tops.map(d => d.group), ...B.lockedList];
      B.board = [...keep.flat(), ...tops.map(d => rows[d.row]).flat(), ...rows.slice(P).flat()];
      toast(`${B.groups[tops[0].group].name} complete!`);
    }
    B.completing = null;
    if (B.solved.size === B.groups.length) { B.busy = false; renderBoard(); flip(before); return setTimeout(() => { if (B === cur) endBoard(true); }, 900); }
    const fresh = refill();
    // Near the end the last rows can only be filled one way; if a row is already complete, play it out.
    const auto = [];
    for (let r = 0; r < playRows(); r++) { const g = rowComplete(r); if (g != null) auto.push({ row: r, group: g }); }
    B.busy = false;
    renderBoard();
    flip(before, fresh);
    if (auto.length) {
      B.busy = true; B.completing = auto;
      setTimeout(() => { if (B !== cur) return; renderBoard(); setTimeout(() => { if (B === cur) resolveRows(auto); }, 1000); }, 1300);
    } else saveBoard();
  }, subs.length ? SQUISH : 0);
}

// Hint: light up two tiles on the board that belong together.
function useHint() {
  if (!B.hints || B.busy || B.over) return;
  const onBoard = new Set(B.board.filter(x => x != null));
  const full = B.groups.filter(g => !B.solved.has(g.id) && g.memberTiles.every(t => onBoard.has(t)));
  if (!full.length) return;
  const g = pick(full);
  // Prefer two tiles that are not already sharing a row, so the hint tells you something new.
  const members = shuffle([...g.memberTiles]);
  const first = members[0];
  const second = members.find(t => t !== first && rowOf(B.board.indexOf(t)) !== rowOf(B.board.indexOf(first))) || members[1];
  B.hints--; B.hintTiles = [first, second];
  renderBoard(); saveBoard();
}
function useFreeze() {
  if (!B.freezes || B.over) return;
  B.freezes--; B.frozenUntil = Math.max(performance.now(), B.frozenUntil) + 30000;
  toast("Clock frozen for 30 seconds");
  renderBoard(); saveBoard();
}

function endBoard(won) {
  if (B.over) return;
  B.over = true; stopTicking();
  const key = "board-" + B.levelIdx;
  store.set("save-" + key, undefined);
  const score = B.timed ? Math.ceil(B.timeLeft) : Math.floor(B.elapsed);
  if (won) {
    store.set("done-" + key, true);
    const prev = store.get()["best-" + key];
    if (prev == null || (B.timed ? score > prev : score < prev)) store.set("best-" + key, score);
    confetti();
  }
  const track = levelsIn(B.level.difficulty);
  const nextLevel = won ? track.find(l => !isDone("board-" + l.idx)) : null;
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">
    <h2>${won ? "Board complete!" : "Time's up"}</h2>
    <p>${won ? `You found all ${B.groups.length} connections.` : `You found ${B.solved.size} of ${B.groups.length} connections. Have another go?`}</p>
    <div class="stats">
      <div class="stat"><b>${B.solved.size}/${B.groups.length}</b><span>Connections</span></div>
      <div class="stat"><b>${B.timed ? fmt(won ? B.timeLeft : 0) : fmt(B.elapsed)}</b><span>${B.timed ? "Time to spare" : "Time taken"}</span></div>
      <div class="stat"><b>${3 - B.hints}</b><span>Hints used</span></div>
    </div>
    <div class="actions">
      ${nextLevel ? `<button class="btn primary" id="next">Next level</button>` : `<button class="btn primary" id="again">${won ? "Play again" : "Try again"}</button>`}
      <button class="btn" id="menu">Back to levels</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  const lvl = B.levelIdx;
  if (nextLevel) $("#next", ov).onclick = () => startBoard(nextLevel.idx);
  else $("#again", ov).onclick = () => startBoard(lvl);
  $("#menu", ov).onclick = showBoardMode;
}

/* Drag and drop, plus tap one tile then tap another to swap. */
function bindDrag(board) {
  let drag = null;
  const slotAt = (x, y) => { const el = document.elementFromPoint(x, y); const s = el && el.closest(".slot"); return s && board.contains(s) ? +s.dataset.i : null; };
  board.addEventListener("pointerdown", e => {
    const tile = e.target.closest(".tile");
    if (!tile || B.busy || B.over) return;
    const i = +tile.dataset.i;
    if (isLocked(i)) return;
    drag = { i, x: e.clientX, y: e.clientY, moved: false, tile, ghost: null, target: null, pid: e.pointerId };
    try { board.setPointerCapture(e.pointerId); } catch {}
  });
  board.addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== drag.pid) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) {
      drag.moved = true;
      const r = drag.tile.getBoundingClientRect();
      const g = document.createElement("div"); g.className = "ghost";
      g.style.width = r.width + "px"; g.style.height = r.height + "px";
      g.style.fontSize = getComputedStyle(drag.tile).fontSize; g.innerHTML = drag.tile.innerHTML;
      const pic = g.querySelector(".pic"); if (pic) pic.style.fontSize = getComputedStyle(drag.tile.querySelector(".pic")).fontSize;
      document.body.appendChild(g); drag.ghost = g;
      drag.tile.classList.add("lifted"); B.sel = null;
      board.querySelectorAll(".tile.sel").forEach(t => t.classList.remove("sel"));
    }
    if (drag.moved) {
      drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px";
      const t = slotAt(e.clientX, e.clientY);
      if (t !== drag.target) {
        board.querySelectorAll(".slot.target").forEach(s => s.classList.remove("target"));
        drag.target = t;
        if (t != null && t !== drag.i && !isLocked(t)) board.querySelector(`.slot[data-i="${t}"]`).classList.add("target");
      }
    }
  });
  const finish = e => {
    if (!drag || e.pointerId !== drag.pid) return;
    const d = drag; drag = null;
    if (d.ghost) d.ghost.remove();
    if (d.moved) {
      d.tile.classList.remove("lifted");
      board.querySelectorAll(".slot.target").forEach(s => s.classList.remove("target"));
      if (e.type === "pointerup" && d.target != null && d.target !== d.i && !isLocked(d.target)) swapSlots(d.i, d.target, true);
      return;
    }
    if (e.type !== "pointerup") return;
    if (B.sel == null) { B.sel = d.i; renderBoard(); }
    else if (B.sel === d.i) { B.sel = null; renderBoard(); }
    else swapSlots(B.sel, d.i);
  };
  board.addEventListener("pointerup", finish);
  board.addEventListener("pointercancel", finish);
  board.addEventListener("click", e => {
    const s = e.target.closest(".slot.empty");
    if (s && B.sel != null) swapSlots(B.sel, +s.dataset.i);
  });
  board.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("tile")) {
      e.preventDefault(); const i = +e.target.dataset.i;
      if (isLocked(i)) return;
      if (B.sel == null) B.sel = i; else if (B.sel === i) B.sel = null; else return swapSlots(B.sel, i);
      renderBoard(); board.querySelector(`.tile[data-i="${i}"]`)?.focus();
    }
  });
}

/* =====================================================================
   WALL MODE (Only Connect style)
   ===================================================================== */
let W = null;

function startWall(idx) {
  leaveGame();
  const wall = WALLS[idx];
  const clues = [];
  wall.groups.forEach((g, gi) => g.tiles.forEach(text => clues.push({ id: clues.length, group: gi, text })));
  W = { idx, wall, clues, order: shuffle(clues.map(c => c.id)), found: [], sel: [], lives: null,
        timeLeft: 180, over: false, busy: false, revealed: new Set(), credited: new Set(), endReason: "" };
  const saved = store.get()["save-wall-" + idx];
  if (saved && saved.order.length === clues.length) {
    Object.assign(W, { order: saved.order, found: saved.found, lives: saved.lives, timeLeft: saved.timeLeft });
    toast("Welcome back. Carrying on where you left off.");
  }
  renderWallScreen();
  saveWall();
  startTicking(wallTick);
}
function saveWall() {
  if (!W || W.over) return;
  store.set("save-wall-" + W.idx, { order: W.order, found: W.found, lives: W.lives, timeLeft: W.timeLeft });
}

function wallTick(dt) {
  if (!W || W.over) return;
  W.timeLeft -= dt;
  const t = $("#timer");
  if (t) { t.querySelector(".t").textContent = fmt(Math.ceil(W.timeLeft)); t.classList.toggle("low", W.timeLeft <= 30); }
  if (W.timeLeft <= 0) return endWall("Time's up");
  if ((W.saveTick = (W.saveTick || 0) + dt) > 2) { W.saveTick = 0; saveWall(); }
}

function renderWallScreen() {
  app.innerHTML = `
  <div class="screen">
    <div class="bar">
      <button class="icon-btn" id="back" aria-label="Back to walls">${ICONS.back}</button>
      <div class="title-block" style="--c:${WALL_COLOURS[0]}"><div class="lvl">${esc(W.wall.name)}</div><small>Connecting wall</small></div>
      <div class="timer" id="timer">${ICONS.clock}<span class="t">${fmt(W.timeLeft)}</span></div>
    </div>
    <div class="sub"><span class="hint-text" id="wallMsg"></span><span class="lives" id="lives"></span></div>
    <div class="wall-stage"><div class="wall" id="wall"></div></div>
  </div>`;
  $("#back").onclick = () => { saveWall(); showWallMode(); };
  $("#wall").addEventListener("click", e => { const b = e.target.closest(".wtile"); if (b) tapClue(+b.dataset.id); });
  renderWall();
}

function renderWall() {
  const el = $("#wall"); if (!el) return;
  const foundIds = W.found.flatMap(g => W.clues.filter(c => c.group === g).map(c => c.id));
  const rest = W.order.filter(id => !foundIds.includes(id));
  let html = "";
  W.found.forEach((g, k) => W.clues.filter(c => c.group === g).forEach(c => {
    const auto = W.revealedGroups && W.revealedGroups.includes(g);
    html += `<button class="wtile found ${auto ? "revealed" : ""}" style="--c:${WALL_COLOURS[k]}" data-id="${c.id}" aria-disabled="true">${esc(c.text)}</button>`;
  }));
  rest.forEach(id => html += `<button class="wtile ${W.sel.includes(id) ? "sel" : ""}" data-id="${id}" aria-pressed="${W.sel.includes(id)}">${esc(W.clues[id].text)}</button>`);
  el.innerHTML = html;
  const msg = $("#wallMsg");
  if (W.over) msg.textContent = W.endReason;
  else if (W.lives == null) msg.textContent = `Pick four clues that connect. ${W.found.length} of 4 groups found.`;
  else msg.textContent = "Careful now, every wrong guess costs a life.";
  $("#lives").innerHTML = W.lives == null ? "" : `Lives ${[0, 1, 2].map(i => ICONS.heart.replace('class="heart"', `class="heart ${i < W.lives ? "" : "gone"}"`)).join("")}`;
}

function tapClue(id) {
  if (W.over || W.busy) return;
  if (W.found.includes(W.clues[id].group)) return;
  const i = W.sel.indexOf(id);
  if (i >= 0) W.sel.splice(i, 1); else W.sel.push(id);
  if (W.sel.length < 4) return renderWall();
  const g = W.clues[W.sel[0]].group;
  if (W.sel.every(x => W.clues[x].group === g)) {
    W.found.push(g); W.sel = [];
    if (W.found.length === 2 && W.lives == null) { W.lives = 3; toast("Two groups found. You now have three lives."); }
    if (W.found.length === 3) {
      const last = [0, 1, 2, 3].find(x => !W.found.includes(x));
      W.found.push(last);
      renderWall();
      return endWall("Wall solved!");
    }
    renderWall(); saveWall();
  } else {
    W.busy = true; renderWall();
    const el = $("#wall"); el.classList.add("shake");
    if (W.lives != null) W.lives--;
    const cur = W;
    setTimeout(() => {
      if (W !== cur) return;
      el.classList.remove("shake"); W.sel = []; W.busy = false;
      if (W.lives === 0) { renderWall(); endWall("Out of lives"); } else { renderWall(); saveWall(); }
    }, 480);
  }
}

function endWall(reason) {
  if (W.over) return;
  W.over = true; W.endReason = reason; stopTicking();
  store.set("save-wall-" + W.idx, undefined);
  store.set("done-wall-" + W.idx, true);
  W.groupsScored = W.found.length;
  W.revealedGroups = [0, 1, 2, 3].filter(g => !W.found.includes(g));
  W.found.push(...W.revealedGroups); W.sel = [];
  renderWall();
  if (W.groupsScored === 4) confetti();
  const cur = W;
  setTimeout(() => { if (W === cur) showWallResults(); }, 900);
}

function wallScore() {
  const conns = W.credited.size;
  return W.groupsScored + conns + (W.groupsScored === 4 && conns === 4 ? 2 : 0);
}

function showWallResults() {
  const ov = document.createElement("div"); ov.className = "overlay";
  const save = () => { const k = "best-wall-" + W.idx, prev = store.get()[k]; if (prev == null || wallScore() > prev) store.set(k, wallScore()); };
  const nextWall = WALLS.findIndex((_, i) => !isDone("wall-" + i));
  const draw = () => {
    ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">
      <h2>${esc(W.endReason)}</h2>
      <p>You score a point for each group found. Now, did you know the connections? Reveal each one and give yourself a point if you had it. Get everything for a 2 point bonus.</p>
      ${W.found.map((g, k) => {
        const words = W.clues.filter(c => c.group === g).map(c => c.text).join(", ");
        const shown = W.revealed.has(g);
        return `<div class="conn" style="--c:${WALL_COLOURS[k]}"><span class="sw"></span>
          <span class="name ${shown ? "" : "hidden"}">${shown ? esc(W.wall.groups[g].name) : "Connection hidden"}</span>
          <span class="ctl">${shown ? `<button class="pill-btn ${W.credited.has(g) ? "on" : ""}" data-credit="${g}">${W.credited.has(g) ? "Got it ✓" : "I had it"}</button>` : `<button class="pill-btn" data-reveal="${g}">Reveal</button>`}</span>
          <span class="words">${esc(words)}</span></div>`;
      }).join("")}
      <div class="stats">
        <div class="stat"><b>${W.groupsScored}</b><span>Groups</span></div>
        <div class="stat"><b>${W.credited.size}</b><span>Connections</span></div>
        <div class="stat"><b>${wallScore()}</b><span>Total / 10</span></div>
      </div>
      <div class="actions">
        ${nextWall >= 0 ? `<button class="btn primary" id="next">Next wall</button>` : `<button class="btn primary" id="again">Play again</button>`}
        <button class="btn" id="menu">Back to walls</button>
      </div>
    </div>`;
    ov.querySelectorAll("[data-reveal]").forEach(b => b.onclick = () => { W.revealed.add(+b.dataset.reveal); draw(); });
    ov.querySelectorAll("[data-credit]").forEach(b => b.onclick = () => { const g = +b.dataset.credit; W.credited.has(g) ? W.credited.delete(g) : W.credited.add(g); save(); draw(); });
    if (nextWall >= 0) $("#next", ov).onclick = () => { save(); startWall(nextWall); };
    else $("#again", ov).onclick = () => { save(); startWall(W.idx); };
    $("#menu", ov).onclick = () => { save(); showWallMode(); };
  };
  save();
  draw();
  document.body.appendChild(ov);
}

// Save on the way out, so closing the app or switching away never loses progress.
addEventListener("pagehide", () => { saveBoard(); saveWall(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) { saveBoard(); saveWall(); } });

showHome();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
