<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Wordolio</title>
<meta name="description" content="Wordolio: a little world of word games. Free, with no adverts.">
<meta name="theme-color" content="#F7F4EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wordolio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: a calm cream app. Screens stack a header, then a stage that scales the board to fit. Colour comes only from the groups. */
:root {
  color-scheme: light;
  --bg: #F7F4EF;
  --bg-deep: #F0EAE3;
  --surface: #FFFCF8;
  --surface-2: #F0EAE3;
  --tray: #EEE6DE;
  --tile: #FFFFFF;
  --tile-edge: #E4D9D3;
  --ink: #29242D;
  --muted: #766D77;
  --border: #E7DEE2;
  --line: rgba(41, 36, 45, .10);
  --brand: #30243F;
  --hi: #A44CEC;
  --accent: #FF6B57;
  --accent-ink: #FFFFFF;
  --gold: #F1AA3C;
  --coral: #FF6B57; --coral-ink: #C2402E;
  --green: #20B583; --green-ink: #0E7F5A;
  --purple: #A552E8; --purple-ink: #7B2FC0;
  --blue: #477EF0; --blue-ink: #2856C2;
  --amber: #F1AA3C; --pink: #E86B9D;
  --shadow: 0 1px 1px rgba(41, 36, 45, .04), 0 6px 16px rgba(80, 50, 40, .08);
  --lift: 0 1px 1px rgba(41, 36, 45, .05), 0 8px 20px rgba(41, 36, 45, .08);
  --card: 0 1px 1px rgba(41, 36, 45, .04), 0 14px 34px rgba(80, 50, 40, .10);
  --font: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --head: "Manrope", "Nunito Sans", system-ui, sans-serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
/* Quick taps on iPad shouldn't zoom the page (double-tap zoom). */
*, *::before, *::after { touch-action: manipulation; }
body {
  margin: 0; color: var(--ink); font-family: var(--font); font-size: 15px;
  background: radial-gradient(130% 70% at 50% 0%, #FBF7EF 0%, var(--bg) 60%, var(--bg-deep) 100%);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overflow: hidden;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.app {
  height: 100%; max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px;
}
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; animation: screenIn .3s ease-out; }
@keyframes screenIn { from { opacity: 0; transform: translateY(8px); } }
.scroll { overflow-y: auto; padding-bottom: 28px; gap: 22px; }

/* ---------- Brand ---------- */
.brand { display: flex; align-items: center; gap: 12px; }
.mark { display: grid; grid-template-columns: repeat(3, 11px); gap: 3px; }
.mark i { width: 11px; height: 11px; border-radius: 3.5px; background: var(--tile-edge); }
.mark i:nth-child(4) { background: #FF5A3C; } .mark i:nth-child(5) { background: #3E7BFA; } .mark i:nth-child(6) { background: var(--green); }
.brand h1 { margin: 0; font-size: 2rem; font-weight: 800; letter-spacing: -.02em; }
.lede { margin: -10px 0 0; color: var(--muted); font-size: 1.02rem; }
.section-label { margin: 0; font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* ---------- Mode cards (home) ---------- */
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 16px; }
.mode-card {
  border: 0; text-align: left; background: var(--surface); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px;
  box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; position: relative; overflow: hidden;
}
.mode-card:active { transform: scale(.98); }
.mode-card .art { height: 92px; border-radius: 14px; background: var(--bg); display: grid; place-items: center; }
.mode-card h2 { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: -.01em; }
.mode-card p { margin: 0; color: var(--muted); line-height: 1.45; font-size: .95rem; }
.mode-card .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; }
.progress-text { font-size: .85rem; font-weight: 600; color: var(--muted); }
.go { background: var(--ink); color: var(--surface); border-radius: 99px; padding: 8px 16px; font-weight: 600; font-size: .9rem; }
.mode-card.soon { background: transparent; box-shadow: none; border: 2px dashed var(--line); cursor: default; }
.mode-card.soon .art { background: transparent; color: var(--muted); font-size: 2rem; }
.mini { display: grid; gap: 4px; }
.mini.b { grid-template-columns: repeat(5, 18px); }
.mini.w { grid-template-columns: repeat(4, 24px); }
.mini i { height: 10px; border-radius: 3px; background: var(--tile); box-shadow: 0 1px 0 var(--tile-edge); }
.mini.w i { height: 14px; }
.mini i.c { background: var(--c); box-shadow: none; }
.home-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.flag-btn { border: 0; height: 46px; padding: 0 14px 0 10px; border-radius: 99px; background: var(--surface); box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .9rem; }
.flag-btn b { font-size: 1.5rem; line-height: 1; }
.greet { margin: -8px 0 0; font-size: 1.15rem; font-weight: 500; }
.path { display: flex; gap: 3px; }
.path i { flex: 1; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--c) 18%, var(--bg)); }
.path i.d { background: var(--c); }
.path i.cur { background: var(--surface); box-shadow: inset 0 0 0 2px var(--c); }
.now { display: flex; flex-direction: column; gap: 2px; }
.now small { font-size: .74rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
.now b { font-size: 1.05rem; font-weight: 600; }
.go.tinted { background: var(--c); color: #fff; }

/* ---------- Welcome and settings ---------- */
.welcome { justify-content: center; align-items: center; }
.welcome .sheet { box-shadow: var(--shadow); animation: none; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > span { font-weight: 700; font-size: 1rem; }
.field input {
  font: inherit; font-size: 1.1rem; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--tile-edge); background: var(--tile); color: var(--ink);
  -webkit-user-select: text; user-select: text; outline: none;
}
.field input:focus { border-color: var(--accent); }
.langs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lang { border: 2px solid transparent; border-radius: 16px; background: var(--bg); padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.lang b { font-size: 2rem; line-height: 1.1; }
.langs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.lang span { font-weight: 700; }
.lang small { color: var(--muted); font-size: .78rem; }
.lang.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.btn.big { padding: 14px 20px; font-size: 1.05rem; }

/* ---------- Mode screen: tracks ---------- */
.topbar { display: grid; grid-template-columns: 46px 1fr 46px; align-items: center; gap: 10px; }
.topbar h2 { margin: 0; text-align: center; font-size: 1.35rem; font-weight: 700; letter-spacing: -.01em; }
.icon-btn { width: 46px; height: 46px; border: 0; border-radius: 14px; background: var(--surface); display: grid; place-items: center; box-shadow: var(--shadow); }
.icon-btn svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 16px; }
.track { background: var(--surface); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); border-top: 5px solid var(--c); }
.track-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.track h3 { margin: 0; font-size: 1.3rem; font-weight: 700; color: var(--c); }
.track .count { font-size: .85rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 30px; height: 30px; border-radius: 9px; border: 0; background: var(--bg); color: var(--muted); font-weight: 700; font-size: .85rem; display: grid; place-items: center; }
.dot.done { background: var(--c); color: #fff; }
.dot.next { box-shadow: inset 0 0 0 2px var(--c); color: var(--c); }
.next-up { display: flex; flex-direction: column; gap: 2px; }
.next-up small { font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.next-up b { font-size: 1.1rem; font-weight: 600; }
.next-up span { font-size: .85rem; color: var(--muted); }
.play {
  border: 0; border-radius: 14px; padding: 13px 18px; font-weight: 700; font-size: 1rem; background: var(--c); color: #fff;
  box-shadow: 0 3px 0 color-mix(in srgb, var(--c) 70%, #000); display: flex; align-items: center; justify-content: center; gap: 8px;
}
.play:active { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 70%, #000); }
.wall-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.wall-chip { border: 0; border-radius: 12px; background: var(--bg); padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 700; }
.wall-chip small { font-size: .7rem; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.wall-chip.done { background: color-mix(in srgb, var(--c) 14%, var(--surface)); }
.wall-chip.saved { box-shadow: inset 0 0 0 2px var(--c); }

/* ---------- Game header ---------- */
.bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.title-block { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.title-block .lvl { font-size: 1.3rem; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
.title-block small { font-size: .74rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
.timer {
  justify-self: end; display: flex; align-items: center; gap: 8px; background: var(--surface); color: var(--ink);
  padding: 8px 14px 8px 10px; border-radius: 99px; font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; box-shadow: var(--shadow);
}
.timer svg { width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 2.4; stroke-linecap: round; }
.timer.frozen { background: #DDF0FF; }
.timer.frozen svg { stroke: #1C7ED6; }
.timer.low { color: var(--accent); animation: tick 1s steps(1) infinite; }
.timer.low svg { stroke: var(--accent); }
@keyframes tick { 50% { transform: scale(1.05); } }
.sub { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; }
.hint-text { color: var(--muted); font-size: .98rem; }
.counter { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums; background: var(--surface); border-radius: 99px; padding: 6px 14px 6px 10px; box-shadow: var(--shadow); }
.stack { position: relative; width: 22px; height: 18px; }
.stack i { position: absolute; left: 0; width: 22px; height: 8px; border-radius: 3px; }
.stack i:nth-child(1) { top: 10px; background: var(--green); }
.stack i:nth-child(2) { top: 5px; background: #3E7BFA; }
.stack i:nth-child(3) { top: 0; background: #FF5A3C; }

/* ---------- Board ---------- */
.stage { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; }
.board {
  width: min(100cqw, 152cqh); aspect-ratio: 1.52; background: var(--tray); border-radius: 2.4cqw; padding: 1.6%;
  box-shadow: inset 0 0.3cqw 1cqw rgba(90, 60, 25, .12);
  display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(7, 1fr); gap: 2.2% 1.6%;
  container-type: inline-size; touch-action: none; position: relative; overflow: hidden;
}
.slot { position: relative; z-index: 1; border-radius: 1.5cqw; min-width: 0; min-height: 0; }
.slot.empty { background: rgba(120, 90, 50, .08); transition: opacity .4s; }
.slot.gone { opacity: 0; }
.slot.target::after { content: ""; position: absolute; inset: -0.5cqw; border-radius: 1.9cqw; border: 0.4cqw dashed var(--accent); }
.tile {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--ink);
  background: var(--tile); border-radius: 1.5cqw; box-shadow: 0 0.25cqw 0 var(--tile-edge), 0 0.8cqw 1.6cqw rgba(90, 60, 25, .10);
  font-weight: 600; font-size: 2.2cqw; letter-spacing: .04em; text-transform: uppercase; line-height: 1.1;
  padding: 0 .4em; cursor: grab; transition: box-shadow .15s, background .3s, color .3s; overflow: hidden;
}
.tile .pic { font-size: 4.4cqw; line-height: 1; letter-spacing: 0; }
.tile.symbol { background: radial-gradient(circle at 50% 35%, #FFFFFF 0%, #FFF5E2 80%); box-shadow: 0 0.25cqw 0 #E9C98A, inset 0 0 0 0.25cqw #F5D9A2, 0 0.8cqw 1.6cqw rgba(90, 60, 25, .10); }
.tile.sel { box-shadow: 0 0 0 0.45cqw var(--accent), 0 1cqw 2cqw rgba(90, 60, 25, .18); transform: translateY(-0.4cqw); }
.tile.lifted { opacity: .2; }
.tile.grouped { color: #fff; background: var(--c); box-shadow: 0 0.25cqw 0 color-mix(in srgb, var(--c) 70%, #000); cursor: default; }
.tile.hinted { animation: hintPulse 1.1s ease-in-out infinite; }
.tile.hinted::after { content: "🔗"; position: absolute; top: .25em; right: .35em; font-size: .9em; }
@keyframes hintPulse { 0%, 100% { box-shadow: 0 0 0 0.3cqw var(--gold), 0 0.8cqw 1.6cqw rgba(90, 60, 25, .10); } 50% { box-shadow: 0 0 0 0.75cqw color-mix(in srgb, var(--gold) 55%, transparent), 0 0.8cqw 1.6cqw rgba(90, 60, 25, .10); } }
.tile.anag { color: #7A45D6; }
.tile.anag::before { content: "↻"; position: absolute; top: .2em; left: .35em; font-size: .85em; opacity: .55; }
.tile.unravel { animation: unravel .8s cubic-bezier(.3, 1.3, .5, 1) both; }
@keyframes unravel { 0% { transform: rotateX(90deg) scale(.9); } 100% { transform: none; } }
.tile.born { animation: born .6s cubic-bezier(.2, .9, .3, 1.5) both; }
@keyframes born { from { transform: scale(.2) rotate(-25deg); } }
.band {
  z-index: 0; grid-column: 1 / -1; margin: -1.25cqw -0.9cqw -0.5cqw; border-radius: 1.9cqw; position: relative;
  background: color-mix(in srgb, var(--c) 22%, var(--surface)); box-shadow: inset 0 0 0 0.25cqw color-mix(in srgb, var(--c) 55%, transparent);
}
.band span {
  position: absolute; top: 0; left: 0; right: 0; text-align: center; color: color-mix(in srgb, var(--c) 75%, #000);
  font-size: 1.3cqw; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; line-height: 1.15;
}
.band.new { animation: bandIn .35s ease-out both; }
@keyframes bandIn { from { transform: scaleX(.9); opacity: 0; } }
.ghost {
  position: fixed; z-index: 50; pointer-events: none; display: grid; place-items: center; text-align: center;
  background: var(--tile); color: var(--ink); border-radius: 12px; padding: 0 .4em; line-height: 1.1;
  box-shadow: 0 16px 34px rgba(90, 60, 25, .28), 0 0 0 3px var(--accent);
  font-family: var(--font); font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
  transform: translate(-50%, -50%) scale(1.08) rotate(-2deg);
}
.ghost .pic { line-height: 1; letter-spacing: 0; }

.tools { display: flex; justify-content: center; gap: 22px; padding-top: 4px; }
.tool-wrap { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.tool { position: relative; width: 60px; height: 60px; border: 0; border-radius: 20px; background: var(--surface); display: grid; place-items: center; font-size: 26px; box-shadow: var(--shadow); }
.tool:active { transform: scale(.94); }
.tool:disabled { opacity: .4; cursor: default; }
.tool .n { position: absolute; top: -6px; right: -6px; min-width: 24px; height: 24px; border-radius: 12px; padding: 0 7px; background: var(--accent); color: #fff; font-size: .8rem; font-weight: 700; display: grid; place-items: center; }
.tool-label { font-size: .78rem; color: var(--muted); font-weight: 600; }

/* ---------- Wall ---------- */
.wall-stage { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; }
.wall {
  width: min(100cqw, 128cqh); aspect-ratio: 1.6; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
  gap: 1.8%; container-type: inline-size; padding: 1.6%; border-radius: 2.4cqw; background: var(--tray); box-shadow: inset 0 0.3cqw 1cqw rgba(90, 60, 25, .12);
}
.wtile {
  border: 0; border-radius: 1.4cqw; color: var(--ink); background: var(--tile); box-shadow: 0 0.25cqw 0 var(--tile-edge), 0 0.8cqw 1.6cqw rgba(90, 60, 25, .10);
  font-weight: 600; font-size: 3cqw; line-height: 1.1; padding: 0 .4em; min-width: 0; transition: background .2s, color .2s, transform .12s;
}
.wtile.sel { transform: translateY(-0.4cqw); box-shadow: 0 0 0 0.45cqw var(--accent), 0 1cqw 2cqw rgba(90, 60, 25, .18); }
.wtile.found { color: #fff; background: var(--c); box-shadow: 0 0.25cqw 0 color-mix(in srgb, var(--c) 70%, #000); cursor: default; }
.wtile.found.new { animation: pop .4s ease-out; }
.wtile.revealed { filter: saturate(.4); opacity: .8; }
@keyframes pop { 40% { transform: scale(1.07); } }
.wall.shake { animation: shake .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
.lives { display: flex; gap: 6px; align-items: center; font-weight: 600; color: var(--muted); }
.lives .heart { width: 24px; height: 24px; }
.lives .heart path { fill: var(--accent); }
.lives .heart.gone path { fill: var(--tile-edge); }

/* ---------- Overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(60, 45, 30, .35); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: grid; place-items: center; padding: 16px; animation: fade .25s; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  background: var(--surface); color: var(--ink); border-radius: 26px; padding: 24px; width: min(540px, 100%);
  max-height: calc(100% - 32px); overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 30px 70px rgba(60, 40, 20, .25); animation: rise .4s cubic-bezier(.2, .9, .3, 1.2);
}
@keyframes rise { from { transform: translateY(24px) scale(.97); opacity: 0; } }
.sheet h2 { font-weight: 800; font-size: 1.9rem; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
.sheet p { margin: 0; color: var(--muted); line-height: 1.45; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { background: var(--bg); border-radius: 14px; padding: 10px 14px; min-width: 96px; }
.stat b { display: block; font-size: 1.45rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 14px; padding: 12px 20px; font-weight: 700; background: var(--bg); color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--surface); }
.btn:active { transform: scale(.97); }
.conn { display: grid; grid-template-columns: 10px 1fr auto; gap: 4px 12px; align-items: center; background: var(--bg); border-radius: 14px; padding: 10px 12px; }
.conn .sw { grid-row: 1 / span 2; width: 10px; align-self: stretch; border-radius: 5px; background: var(--c); }
.conn .name, .conn .words { grid-column: 2; min-width: 0; }
.conn .ctl { grid-column: 3; grid-row: 1 / span 2; }
.conn .words { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.conn .name { font-weight: 700; }
.conn .name.hidden { color: var(--muted); font-weight: 500; font-style: italic; }
.pill-btn { border: 0; border-radius: 99px; padding: 8px 12px; font-size: .82rem; font-weight: 700; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.pill-btn.on { background: var(--green); color: #fff; }
.toast {
  position: fixed; left: 50%; top: calc(66px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 99px; font-weight: 600; z-index: 70;
  box-shadow: 0 10px 24px rgba(60, 40, 20, .25); animation: fade .2s; max-width: calc(100% - 48px); text-align: center;
}

/* ---------- Daily games ---------- */
.tool.empty { opacity: .45; }
.mini.f { grid-template-columns: repeat(5, 18px); }
.mini.f i { height: 18px; }
.mwheel { position: relative; width: 84px; height: 84px; }
.mwheel b, .mwheel i { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: .8rem; text-transform: uppercase; }
.mwheel b { background: var(--purple); color: #fff; }
.mwheel i { background: var(--tile); box-shadow: 0 1px 0 var(--tile-edge); transform: rotate(var(--a)) translateY(-29px) rotate(calc(-1 * var(--a))); }
.daily { align-items: center; }
.daily .bar { width: 100%; }
.daily-msg { margin: 0; min-height: 1.4em; text-align: center; color: var(--muted); font-weight: 500; }
.fgrid { display: grid; gap: 7px; width: min(330px, 100%); }
.frow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.frow.shake { animation: shake .45s; }
.ft { aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; font-size: 1.7rem; font-weight: 800; text-transform: uppercase; background: var(--surface); box-shadow: inset 0 0 0 2px var(--tile-edge); }
.ft.typed { box-shadow: inset 0 0 0 2px var(--ink); animation: pop .15s; }
.ft.c, .key.c { background: var(--green); color: #fff; box-shadow: none; }
.ft.p, .key.p { background: var(--amber); color: #fff; box-shadow: none; }
.ft.a, .key.a { background: #A79FA5; color: #fff; box-shadow: none; }
.ft.flip { animation: fflip .5s ease both; animation-delay: var(--d); }
@keyframes fflip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
#keys { width: 100%; display: flex; justify-content: center; margin-top: auto; padding-bottom: 6px; }
.keys { display: flex; flex-direction: column; gap: 7px; width: min(560px, 100%); }
.krow { display: flex; gap: 5px; justify-content: center; }
.key { flex: 1; max-width: 48px; height: 54px; border: 0; border-radius: 9px; background: var(--surface); box-shadow: 0 1px 0 var(--tile-edge); font-weight: 700; font-size: 1.05rem; text-transform: uppercase; padding: 0; }
.key.wide { max-width: 74px; flex: 1.5; font-size: .8rem; }
.dist { display: flex; flex-direction: column; gap: 5px; }
.dist div { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.dist i { font-style: normal; background: var(--tile-edge); color: var(--ink); border-radius: 5px; padding: 2px 8px; text-align: right; font-size: .85rem; }
.dist i.on { background: var(--green); color: #fff; }
.wheel-top { width: min(640px, 100%); }
.rank-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.rank-head b { font-size: 1.2rem; color: var(--purple); }
.rank-head span { color: var(--muted); font-weight: 600; font-size: .9rem; }
.rank-bar { display: flex; gap: 4px; margin-top: 6px; }
.rank-bar i { flex: 1; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--purple) 15%, var(--bg)); }
.rank-bar i.on { background: var(--purple); }
.wheel-body { flex: 1; min-height: 0; width: min(900px, 100%); display: flex; gap: 24px; align-items: stretch; }
.wheel-play { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.typed { min-height: 46px; font-size: 2rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.typed .mid { color: var(--purple); }
.typed .ph, .words .ph { font-size: 1rem; letter-spacing: 0; text-transform: none; color: var(--muted); font-weight: 500; }
.wheel { position: relative; width: min(280px, 68vw); aspect-ratio: 1; }
.wl { position: absolute; left: 50%; top: 50%; width: 27%; aspect-ratio: 1; margin: -13.5%; border: 0; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); font-size: 1.7rem; font-weight: 800; text-transform: uppercase;
  transform: rotate(var(--a)) translateY(-118%) rotate(calc(-1 * var(--a))); }
.wl.centre { transform: none; background: var(--purple); color: #fff; }
.wl:active { filter: brightness(.92); }
.wheel-btns { display: flex; gap: 10px; }
.wheel-btns.extra { margin-top: 28px; padding-top: 18px; border-top: 1px dashed var(--tile-edge); }
.clue-btn.ask { background: #F5B42A; color: #2A2420; }
.wheel-body .found { flex: 1; max-width: 420px; background: var(--surface); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.clue-btn { background: #FFF3D6; }
.wgroup { display: flex; flex-wrap: wrap; gap: 6px 10px; }
.wgroup h4 { flex-basis: 100%; margin: 4px 0 0; font-size: .85rem; display: flex; justify-content: space-between; }
.wgroup h4 span { color: var(--muted); font-weight: 600; }
.ans { display: flex; gap: 2px; }
.ans i { width: 19px; height: 24px; border-bottom: 2px solid var(--tile-edge); display: grid; place-items: center; font-style: normal; font-weight: 700; text-transform: uppercase; font-size: .9rem; color: var(--muted); }
.ans.got i { color: var(--ink); border-color: var(--purple); }
.ans.pg.got i { color: var(--purple); }
.words { display: flex; flex-wrap: wrap; gap: 6px; }
.words span { background: var(--bg); border-radius: 8px; padding: 4px 9px; font-weight: 600; text-transform: capitalize; }
.words span.pg { background: var(--purple); color: #fff; }
.done-sheet { text-align: center; }
.done-art { position: relative; width: 84px; margin: 0 auto 8px; }
.done-art span { position: absolute; right: -26px; bottom: -6px; font-size: 2.4rem; animation: pop .6s ease-out; }
.yday { max-height: 86vh; display: flex; flex-direction: column; }
.yday-head { display: flex; align-items: center; gap: 14px; }
.yday-head h2 { margin: 0; } .yday-head p { margin: 4px 0 0; color: var(--muted); }
.yday-list { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
.words span.miss { background: color-mix(in srgb, var(--purple) 18%, var(--surface)); color: #6B21A8; }
.words span.miss.pg { background: var(--purple); color: #fff; }
.bonus { border-top: 1px dashed var(--tile-edge); padding-top: 10px; }
.bonus h4 { margin: 0 0 6px; font-size: .85rem; display: flex; justify-content: space-between; }
.bonus h4 span, .bonus p { color: var(--muted); font-weight: 600; }
.bonus p { margin: 0; font-size: .85rem; font-weight: 500; }
/* =====================================================================
   WORDOLIO LOOK
   Soft cream background, rounded cards, gradient badges and pill buttons.
   Each game has its own colour, passed in as --c (and --ci for text).
   ===================================================================== */
body {
  font-family: var(--font);
  background: radial-gradient(1200px 500px at 85% -10%, #FBEFE6 0, rgba(251, 239, 230, 0) 60%), radial-gradient(900px 600px at -10% 110%, #F3EAF6 0, rgba(243, 234, 246, 0) 60%), var(--bg);
}
h1, h2, h3, h4, .h { font-family: var(--head); letter-spacing: -.015em; }
.app { max-width: 1180px; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.round {
  width: 48px; height: 48px; flex: none; border: 0; border-radius: 999px; background: var(--surface); color: var(--brand);
  display: grid; place-items: center; box-shadow: var(--lift); padding: 0;
}
.round .ico { stroke-width: 2.6; }
.round:active, .gpill:active, .go:active, .btn:active { transform: scale(.96); }
.wordmark { font-family: var(--head); font-weight: 800; letter-spacing: -.02em; color: var(--ink); white-space: nowrap; }
.wordmark span { color: var(--hi); }
.logo { display: flex; align-items: center; gap: 12px; }
.logo .wordmark { font-size: 32px; line-height: 1; }
.tagline { margin: 4px 0 0; color: var(--muted); font-size: 1rem; font-weight: 600; }

/* ---------- Shared game header ---------- */
.ghead { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; }
.ghead-l { display: flex; align-items: center; gap: 14px; min-width: 0; }
.ghead-brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ghead-brand .wordmark { font-size: 18px; }
.ghead-c { text-align: center; min-width: 0; }
.ghead-c h1 { margin: 0; font-size: 28px; font-weight: 800; line-height: 1.1; white-space: nowrap; }
.ghead-c small { display: block; margin-top: 3px; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ci, var(--c)); white-space: nowrap; }
.ghead-r { justify-self: end; display: flex; gap: 8px; align-items: center; }
.gpill, .timer {
  height: 44px; padding: 0 15px 0 12px; border: 0; border-radius: 999px; background: var(--surface); color: var(--ink);
  display: inline-flex; align-items: center; gap: 8px; box-shadow: var(--lift);
  font-family: var(--head); font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.gpill .ico, .timer svg { width: 20px; height: 20px; stroke: var(--ci, var(--muted)); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.gpill.help { width: 44px; padding: 0; justify-content: center; }
.gpill.help .ico { stroke: var(--muted); }
.timer.frozen { background: #E1EEFF; }
.timer.frozen svg { stroke: var(--blue); }
.timer.low { color: var(--coral-ink); }
.timer.low svg { stroke: var(--coral); }
.sub { min-height: 40px; }
.hint-text, .daily-msg { color: var(--muted); font-weight: 600; }
.counter, .lives { height: 40px; background: var(--surface); border-radius: 999px; padding: 0 14px 0 12px; box-shadow: var(--lift); font-family: var(--head); font-weight: 800; }
.lives { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .9rem; }
.lives:empty { display: none; }
.lives .heart path { fill: var(--coral); }
.stack i:nth-child(1) { background: var(--green); } .stack i:nth-child(2) { background: var(--blue); } .stack i:nth-child(3) { background: var(--coral); }

/* ---------- Home ---------- */
.home { padding-bottom: 120px; gap: 18px; padding-inline: 14px; margin-inline: -14px; }
.home-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 6px; }
.hello { display: flex; align-items: center; justify-content: space-between; gap: 18px 24px; flex-wrap: wrap; }
.hello h1 { margin: 0; font-size: 40px; font-weight: 800; line-height: 1.1; }
.hello p { margin: 4px 0 0; font-size: 1.15rem; color: var(--muted); font-weight: 600; }
.statstrip { display: flex; background: var(--surface); border-radius: 22px; padding: 12px 4px; box-shadow: var(--card); }
.statstrip > div { display: flex; align-items: center; gap: 10px; padding: 0 16px; }
.statstrip > div + div { border-left: 1px solid var(--border); }
.statstrip .dotico { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.statstrip b { display: block; font-family: var(--head); font-weight: 800; font-size: 17px; line-height: 1.15; }
.statstrip span span { display: block; font-size: 13px; color: var(--muted); font-weight: 600; line-height: 1.2; }
.games-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 4px; }
.games-head h2 { margin: 0; font-size: 26px; font-weight: 800; }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--surface); box-shadow: 0 4px 12px rgba(80, 50, 40, .07); font-weight: 700; font-size: 14px; color: #5E5560; }
.chip .ico { width: 17px; height: 17px; }
.games { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.gcard {
  border: 0; text-align: left; background: var(--surface); border-radius: 26px; padding: 10px; display: flex; flex-direction: column;
  box-shadow: var(--card); position: relative; color: var(--ink); transition: transform .15s;
}
.gcard:active { transform: scale(.98); }
.gcard .art { position: relative; height: 158px; border-radius: 20px; overflow: hidden; display: grid; place-items: center; background: var(--art); }
.badge {
  position: absolute; left: 12px; top: 12px; width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; color: #fff;
  background: var(--badge); box-shadow: 0 6px 14px rgba(0, 0, 0, .14), inset 0 1px 0 rgba(255, 255, 255, .35);
}
.badge .ico { stroke-width: 2.3; }
.gcard .body { padding: 12px 8px 6px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
.gcard h3 { margin: 0; font-size: 25px; font-weight: 800; }
.gcard p { margin: 0; font-size: 14.5px; color: var(--muted); line-height: 1.35; }
.gcard .foot { margin-top: auto; padding-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.gcard .status { min-width: 0; }
.gcard .status b { display: block; font-weight: 800; font-size: 15px; line-height: 1.25; }
.meter { height: 5px; width: 96px; border-radius: 9px; background: #EFE6DF; margin-top: 6px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 9px; background: var(--c); }
.go {
  height: 42px; padding: 0 14px 0 18px; border: 0; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; flex: none;
  font-family: var(--head); font-weight: 800; font-size: 15px; color: #fff; white-space: nowrap;
  background: linear-gradient(160deg, color-mix(in srgb, var(--c) 85%, #fff), color-mix(in srgb, var(--c) 82%, #000));
  box-shadow: 0 6px 14px rgba(0, 0, 0, .12), inset 0 1px 0 rgba(255, 255, 255, .3);
}
.go .ico { width: 15px; height: 15px; stroke-width: 3; }
.gcard.off { cursor: default; }
.gcard.off .art { filter: saturate(.5); opacity: .7; }
.gcard .soon-tag { font-size: 13px; font-weight: 800; color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; }
.soon-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.soon-card { display: flex; align-items: center; gap: 14px; padding: 12px 18px 12px 12px; background: color-mix(in srgb, var(--surface) 70%, transparent); border: 2px dashed var(--border); border-radius: 22px; }
.soon-card .art { width: 64px; height: 64px; flex: none; border-radius: 16px; display: grid; place-items: center; background: var(--art); color: #fff; }
.soon-card .art span { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--badge); box-shadow: 0 4px 10px rgba(0, 0, 0, .12); }
.soon-card h3 { margin: 0; font-size: 18px; font-weight: 800; }
.soon-card p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
.soon-card .soon-tag { margin-left: auto; flex: none; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.games-sub { margin: 6px 0 0; font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
/* Little game boards inside the cards */
.mt { display: block; border-radius: 5px; background: #fff; box-shadow: 0 1.5px 0 rgba(0, 0, 0, .06), 0 3px 6px rgba(0, 0, 0, .06); }
.mboard { display: grid; gap: 5px; margin-left: 30px; }
.mboard.b { grid-template-columns: repeat(5, 30px); }
.mboard.b .mt { height: 17px; }
.mboard.w { grid-template-columns: repeat(4, 38px); }
.mboard.w .mt { height: 20px; }
.mboard.f { grid-template-columns: repeat(5, 28px); gap: 6px; }
.mboard.f .mt { height: 28px; position: relative; display: grid; place-items: center; font-family: var(--head); font-weight: 800; font-size: 13px; color: #fff; }
.mboard.f .mt.c::after { content: ""; position: absolute; left: 7px; right: 7px; bottom: 3px; height: 2.5px; border-radius: 2px; background: rgba(255, 255, 255, .85); }
.mboard.f .mt.p::after { content: ""; position: absolute; right: 4px; top: 4px; width: 5px; height: 5px; border-radius: 50%; background: rgba(255, 255, 255, .9); }
.mwheel.big { width: 112px; height: 112px; margin-left: 24px; }
.mwheel.big b, .mwheel.big i { width: 34px; height: 34px; margin: -17px; font-size: .95rem; font-family: var(--head); }
.mwheel.big i { transform: rotate(var(--a)) translateY(-38px) rotate(calc(-1 * var(--a))); }
.mwheel b { background: var(--purple); }
.mwheel i { background: #fff; box-shadow: 0 1.5px 0 rgba(0, 0, 0, .06), 0 3px 6px rgba(0, 0, 0, .06); }

/* ---------- Bottom bar (home, statistics, settings) ---------- */
.navbar {
  position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40;
  display: flex; gap: 4px; padding: 6px; border-radius: 999px; background: rgba(255, 252, 248, .92);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 1px 1px rgba(41, 36, 45, .05), 0 14px 34px rgba(41, 36, 45, .14);
}
.navbar button { border: 0; background: transparent; height: 52px; padding: 0 20px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-family: var(--head); font-weight: 800; font-size: 15px; color: var(--muted); }
.navbar button.on { background: #FBE7D6; color: var(--brand); }
.navbar button.on .ico { stroke: var(--coral-ink); }

/* ---------- Statistics and settings pages ---------- */
.page-head h1 { margin: 0; font-size: 36px; font-weight: 800; }
.page-head p { margin: 4px 0 0; color: var(--muted); font-weight: 600; font-size: 1.05rem; }
.panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.panel { background: var(--surface); border-radius: 26px; padding: 18px 20px 20px; box-shadow: var(--card); display: flex; flex-direction: column; gap: 14px; }
.panel-head { display: flex; align-items: center; gap: 12px; }
.panel-head .badge { position: static; width: 38px; height: 38px; border-radius: 12px; }
.panel-head .badge .ico { width: 20px; height: 20px; }
.panel-head h2 { margin: 0; font-size: 21px; font-weight: 800; }
.panel-head small { display: block; color: var(--muted); font-weight: 600; font-size: 13px; }
.nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 10px; }
.num { background: var(--bg); border-radius: 16px; padding: 10px 12px; }
.num b { display: block; font-family: var(--head); font-weight: 800; font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.15; color: var(--ink); }
.num span { font-size: 12.5px; color: var(--muted); font-weight: 700; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.barrow { display: grid; grid-template-columns: 74px 1fr auto; gap: 10px; align-items: center; font-weight: 700; font-size: 14px; }
.barrow .track { height: 10px; border-radius: 9px; background: #EFE6DF; overflow: hidden; border: 0; padding: 0; box-shadow: none; display: block; }
.barrow .track i { display: block; height: 100%; border-radius: 9px; background: var(--c); }
.barrow em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.note { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.4; }
.setting { display: flex; align-items: center; gap: 14px; }
.setting .txt { flex: 1; min-width: 0; }
.setting .txt b { display: block; font-family: var(--head); font-weight: 800; font-size: 16px; }
.setting .txt span { color: var(--muted); font-size: 14px; }
.switch { position: relative; width: 56px; height: 34px; border: 0; border-radius: 999px; background: #E2D9DD; flex: none; padding: 0; transition: background .2s; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .18); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--green); }
.switch[aria-checked="true"]::after { transform: translateX(22px); }
.field input { border-color: var(--border); border-radius: 16px; background: #fff; font-family: var(--font); }
.field input:focus { border-color: var(--hi); }
.field > span { font-family: var(--head); font-weight: 800; }
.lang { background: var(--bg); border-radius: 18px; }
.lang span { font-family: var(--head); font-weight: 800; }
.lang.on { border-color: var(--hi); background: color-mix(in srgb, var(--hi) 8%, var(--surface)); }
.welcome .sheet { box-shadow: var(--card); gap: 18px; }

/* ---------- Sheets and buttons ---------- */
.overlay { background: rgba(41, 36, 45, .32); }
.sheet { --c: var(--brand); border-radius: 28px; box-shadow: 0 30px 70px rgba(41, 36, 45, .25); }
.sheet h2 { font-size: 1.8rem; }
.sheet-badge { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; color: #fff; background: linear-gradient(160deg, color-mix(in srgb, var(--c) 80%, #fff), color-mix(in srgb, var(--c) 85%, #000)); box-shadow: 0 8px 18px rgba(0, 0, 0, .14), inset 0 1px 0 rgba(255, 255, 255, .35); }
.sheet-badge .ico { width: 28px; height: 28px; }
.done-sheet .sheet-badge { margin: 0 auto; }
.stat { background: var(--bg); border-radius: 16px; }
.stat b { font-family: var(--head); font-weight: 800; }
.btn { border-radius: 999px; padding: 12px 22px; font-family: var(--head); font-weight: 800; background: var(--surface); color: var(--ink); box-shadow: var(--lift); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { color: #fff; background: linear-gradient(160deg, color-mix(in srgb, var(--c, var(--brand)) 85%, #fff), color-mix(in srgb, var(--c, var(--brand)) 82%, #000)); box-shadow: 0 6px 14px rgba(0, 0, 0, .12), inset 0 1px 0 rgba(255, 255, 255, .3); }

/* ---------- Word Steps and Letter Lock ---------- */
.steps-screen { --ci: #B9780F; }
.lock-screen { --ci: #B83A6E; }
.steps-screen .btn.primary, .lock-screen .btn.primary, .lvsheet .btn.primary { background: linear-gradient(160deg, color-mix(in srgb, var(--ci) 88%, #fff), var(--ci)); }
.btn:disabled { opacity: .45; box-shadow: none; }

.steps-body { flex: 1; min-height: 0; width: min(560px, 100%); display: flex; flex-direction: column; gap: 10px; }

.rung { display: grid; grid-template-columns: 72px auto 72px; align-items: center; gap: 12px; position: relative; }
.rl { font: 800 11px var(--head); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); text-align: right; }
.tiles { display: flex; gap: 6px; }

.st.match::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 6px; height: 3px; border-radius: 2px; background: var(--ci); }
.rung.start .st { background: #FFF0D6; }

.pw { display: flex; gap: 3px; }
.pc { --w: min(36px, calc(100cqw / 12 - 3px)); width: var(--w); border: 0; padding: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink); }

/* Players work through one path: every Easy level, then Medium, then Hard. French players have their own levels. */
const DIFFS = ["Easy", "Medium", "Hard"];
const LEVELS = () => isFR() ? BOARD_LEVELS_FR : BOARD_LEVELS;

/* Shrinks a tile's text until the longest word fits, so long clues never spill out on small screens. */
// The text box has overflow hidden, so scrollWidth reliably shows a word that is too wide (Safari included).
function fitText(root, sel) {
  const run = () => root.querySelectorAll(sel).forEach(el => {
    const tx = el.querySelector(".tx"); if (!tx) return;
    tx.style.fontSize = "";
    let size = parseFloat(getComputedStyle(tx).fontSize), n = 0;
    while ((tx.scrollWidth > tx.clientWidth + 0.5 || tx.scrollHeight > el.clientHeight * 0.92) && n++ < 16) { size *= 0.93; tx.style.fontSize = size + "px"; }
  });
  run();
  // Measure again once the fonts have loaded and the layout has settled.
  requestAnimationFrame(run);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => root.isConnected && run());
}
addEventListener("resize", () => { const w = $("#wall"); if (w) fitText(w, ".wtile"); });

/* ---------- timer (shared) ---------- */
let tickHandle = null, lastTick = 0, onTick = null;
function startTicking(fn) {
  stopTicking(); onTick = fn; lastTick = performance.now();
  tickHandle = setInterval(() => { const now = performance.now(); const dt = (now - lastTick) / 1000; lastTick = now; if (!document.hidden) onTick(dt, now); }, 200);
}
function stopTicking() { clearInterval(tickHandle); tickHandle = null; }

/* ---------- confetti ---------- */
function confetti() {
  if (reduceMotion()) return;
  const c = document.createElement("canvas"); c.id = "confetti"; document.body.appendChild(c);
  const ctx = c.getContext("2d"), dpr = devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const bits = Array.from({ length: 140 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .45, vx: (Math.random() - .5) * 14, vy: -Math.random() * 16 - 4,
    r: Math.random() * Math.PI, vr: (Math.random() - .5) * .4, w: 7 + Math.random() * 7, h: 4 + Math.random() * 4, col: pick(GROUP_COLOURS),
  }));
  let t = 0;
  (function frame() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    bits.forEach(b => { b.vy += .4; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.col; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.restore(); });
    if (++t < 170) requestAnimationFrame(frame); else c.remove();
  })();
}

    return pick([`${part} ${n}, ravi de vous revoir.`, `Salut ${n}, comment ça va aujourd'hui ?`, `Bon retour, ${n}. Prêt pour un nouveau défi ?`]);
  }
