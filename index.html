/* =====================================================================
   BOARD MODE
   A found group shrinks into a picture only when it is part of a bigger
   answer. Groups with nothing above them stay as full-colour rows, which
   settle into a stack at the bottom of the board.
   ===================================================================== */
let B = null;

function buildLevel(level, levelIdx) {
  const groups = [], tiles = [];
  function addGroup(spec, parent) {
    const g = { id: groups.length, name: loc(spec.name), pic: spec.pic || null, parent, memberTiles: [] };
    groups.push(g);
    spec.tiles.forEach(t => {
      if (typeof t === "object") g.memberTiles.push(addGroup(t, g.id));
      else { const raw = parseTile(t), tile = { id: tiles.length, ...raw, label: loc(raw.label), parent: g.id, symbolOf: null }; tiles.push(tile); g.memberTiles.push(tile.id); }
    });
    return g;
  }
  level.groups.forEach(s => addGroup(s, null));
  groups.forEach(g => {
    if (g.parent != null) { const t = { id: tiles.length, label: g.name, pic: g.pic, parent: g.parent, symbolOf: g.id }; tiles.push(t); g.symbolTile = t.id; }
  });
  groups.forEach(g => g.memberTiles = g.memberTiles.map(m => typeof m === "object" ? m.symbolTile : m));
  let ci = 0;
  groups.filter(g => g.parent == null).forEach(g => g.colour = GROUP_COLOURS[ci++ % GROUP_COLOURS.length]);
  groups.filter(g => g.parent != null).forEach(g => g.colour = GROUP_COLOURS[ci++ % GROUP_COLOURS.length]);
  // Order of play: groups that shrink into pictures come first (tier 0), then the big groups they build (1), then plain rows (2).
  groups.forEach(g => g.tier = g.parent != null ? 0 : g.memberTiles.some(t => tiles[t].symbolOf != null) ? 1 : 2);
  // Anagram round: about half the groups get one scrambled word each, never more than one per group.
  if (level.anagrams) {
    const rnd = seeded(levelIdx * 7919 + (isUS() ? 1 : 0));
    const word = id => tiles[id].symbolOf == null && !tiles[id].pic && /^[A-Za-z]{4,9}$/.test(tiles[id].label);
    const cands = groups.filter(g => g.memberTiles.some(word));
    for (let i = cands.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [cands[i], cands[j]] = [cands[j], cands[i]]; }
    cands.slice(0, Math.ceil(cands.length / 2)).forEach(g => {
      const opts = g.memberTiles.filter(word), t = tiles[opts[Math.floor(rnd() * opts.length)]];
      t.anagram = scramble(t.label, rnd);
    });
  }
  return { groups, tiles };
}

function startBoard(levelIdx) {
  leaveGame();
  const level = LEVELS()[levelIdx];
  const { groups, tiles } = buildLevel(level, levelIdx);
  B = {
    levelIdx, level, groups, tiles, board: new Array(SIZE).fill(null), lockedList: [], solved: new Set(),
    pool: tiles.filter(t => t.symbolOf == null).map(t => t.id),
    timed: !!level.time, timeLeft: level.time || 0, elapsed: 0, frozenUntil: 0,
    hintsUsed: 0, freezes: level.time ? 2 : 0, busy: false, sel: null, completing: null, hintTiles: [], born: null, over: false,
    unravelled: new Set(),
  };
  const saved = store.get()["save-" + bkey(levelIdx)];
  if (saved && saved.sig === tiles.length + ":" + groups.length) {
    Object.assign(B, { board: saved.board, lockedList: saved.lockedList, solved: new Set(saved.solved), pool: saved.pool,
      timeLeft: saved.timeLeft, elapsed: saved.elapsed, hintsUsed: saved.hintsUsed || 0, freezes: saved.freezes, hintTiles: saved.hintTiles || [] });
    renderBoardScreen();
    flip(new Map(), new Set(B.board.filter(x => x != null)));
    toast(tr("Welcome back. Carrying on where you left off."));
  } else {
    // Opening deal: the minimum number of complete word groups plus a random mix.
    const wordGroups = shuffle(groups.filter(g => g.memberTiles.every(t => tiles[t].symbolOf == null))).sort((a, b) => a.tier - b.tier);
    const deal = wordGroups.slice(0, MIN_ANSWERS[level.difficulty] ?? 2).flatMap(g => g.memberTiles);
    B.pool = poolOrder(B.pool.filter(t => !deal.includes(t)));
    while (deal.length < SIZE && B.pool.length) deal.push(B.pool.pop());
    shuffle(deal).forEach((id, i) => B.board[i] = id);
    breakCompleteRows();
    renderBoardScreen();
    flip(new Map(), new Set(B.board.filter(x => x != null)));
    if (level.anagrams) {
      const ov = document.createElement("div"); ov.className = "overlay";
      ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" ${sheetStyle("board")}>${sheetBadge("shuffle")}<h2>${tr("Anagram round")}</h2>
        <p>${tr("Some groups have one word with its letters scrambled, marked ↻. Work out what it really says. When you find the group, it unscrambles.")}</p>
        <div class="actions"><button class="btn primary" id="ok">${tr("Got it")}</button></div></div>`;
      document.body.appendChild(ov); $("#ok", ov).onclick = () => ov.remove();
    }
  }
  saveBoard();
  startTicking(boardTick);
}

function saveBoard() {
  if (!B || B.over || B.busy) return;
  store.set("save-" + bkey(B.levelIdx), {
    sig: B.tiles.length + ":" + B.groups.length, board: B.board, lockedList: B.lockedList, solved: [...B.solved], pool: B.pool,
    timeLeft: B.timeLeft, elapsed: B.elapsed, hintsUsed: B.hintsUsed, freezes: B.freezes, hintTiles: B.hintTiles,
  });
}

const T = id => B.tiles[id];
const rowOf = i => Math.floor(i / COLS);
const playRows = () => ROWS - B.lockedList.length;
const lockedGroupAt = r => r >= playRows() ? B.lockedList[r - playRows()] : null;
const isLocked = i => rowOf(i) >= playRows() || (B.completing && B.completing.some(c => c.row === rowOf(i)));
function rowIds(r) { return B.board.slice(r * COLS, r * COLS + COLS); }
function rowComplete(r) {
  if (r >= playRows()) return null;
  const ids = rowIds(r);
  if (ids.some(x => x == null)) return null;
  const p = T(ids[0]).parent;
  return ids.every(x => T(x).parent === p) && !B.solved.has(p) ? p : null;
}
const playable = () => B.board.map((_, i) => i).filter(i => rowOf(i) < playRows());
function breakCompleteRows() {
  for (let guard = 0; guard < 100; guard++) {
    const r = [...Array(ROWS).keys()].find(r => rowComplete(r) != null);
    if (r == null) return;
    const a = r * COLS + Math.floor(Math.random() * COLS);
    const others = playable().filter(i => rowOf(i) !== r && B.board[i] != null && T(B.board[i]).parent !== T(B.board[a]).parent);
    if (!others.length) return;
    const b = pick(others);
    [B.board[a], B.board[b]] = [B.board[b], B.board[a]];
  }
}
// Tiles fall down each column to fill gaps, leaving any spaces at the top.
function gravity() {
  const P = playRows();
  for (let c = 0; c < COLS; c++) {
    const col = [];
    for (let r = P - 1; r >= 0; r--) if (B.board[r * COLS + c] != null) col.push(B.board[r * COLS + c]);
    for (let r = P - 1, k = 0; r >= 0; r--, k++) B.board[r * COLS + c] = col[k] ?? null;
  }
}
// How many answers the board always keeps available, by difficulty.
const MIN_ANSWERS = { Easy: 3, Medium: 3, Hard: 2 };
const minAnswers = () => MIN_ANSWERS[B.level.difficulty] ?? 2;

// Hidden tiles are drawn from the end of the pool: picture-group words first, plain-row words last.
const tierOf = id => B.groups[T(id).parent].tier;
const poolOrder = pool => shuffle(pool).sort((a, b) => tierOf(b) - tierOf(a));

// Drop hidden words in from the top, keeping a minimum number of complete answers on the board.
function refill() {
  const incoming = [], keep = new Set();
  for (let guard = 0; guard < 12; guard++) {
    const on = new Set([...B.board.filter(x => x != null), ...incoming]);
    const open = B.groups.filter(g => !B.solved.has(g.id));
    const complete = open.filter(g => g.memberTiles.every(t => on.has(t)));
    complete.forEach(g => keep.add(g.id));
    if (complete.length >= minAnswers()) break;
    const inPool = new Set(B.pool);
    const missingOf = g => g.memberTiles.filter(t => !on.has(t)).length;
    const ready = open.filter(g => !keep.has(g.id) && g.memberTiles.every(t => on.has(t) || inPool.has(t)))
      .sort((x, y) => x.tier - y.tier || missingOf(x) - missingOf(y));
    const g = ready[0];
    if (!g) break;
    keep.add(g.id);
    const missing = g.memberTiles.filter(t => !on.has(t));
    let room = playable().filter(i => B.board[i] == null).length - incoming.length;
    // Not enough room? Quietly send some unrelated tiles back to the hidden stack.
    while (missing.length > room) {
      const others = playable().filter(i => B.board[i] != null && !keep.has(T(B.board[i]).parent));
      let cands = others.filter(i => T(B.board[i]).symbolOf == null && !B.hintTiles.includes(B.board[i]));
      if (!cands.length) cands = others;
      if (!cands.length) break;
      // Send back plain-row words first, so the picture groups stay in play.
      const top = Math.max(...cands.map(i => tierOf(B.board[i])));
      const i = pick(cands.filter(i => tierOf(B.board[i]) === top)); B.pool.push(B.board[i]); B.board[i] = null; room++;
    }
    if (missing.length > room) break;
    incoming.push(...missing);
    B.pool = B.pool.filter(t => !missing.includes(t));
  }
  gravity();
  B.pool = poolOrder(B.pool);
  const empties = playable().filter(i => B.board[i] == null);
  while (incoming.length < empties.length && B.pool.length) incoming.push(B.pool.pop());
  shuffle(incoming);
  empties.sort((a, b) => b - a).forEach((slot, k) => { if (k < incoming.length) B.board[slot] = incoming[k]; });
  gravity();
  breakCompleteRows();
  return new Set(incoming);
}

/* Smooth movement: remember where tiles were, re-render, then animate each one from its old spot to its new one. */
function tileRects() {
  const m = new Map();
  document.querySelectorAll("#board .tile").forEach(el => m.set(+el.dataset.id, el.getBoundingClientRect()));
  return m;
}
function flip(before, fresh = new Set(), skip = null) {
  const board = $("#board"); if (!board || !board.animate) return;
  const top = board.getBoundingClientRect().top;
  const slow = reduceMotion() ? .6 : 1;
  board.querySelectorAll(".tile").forEach(el => {
    const id = +el.dataset.id, a = el.getBoundingClientRect(), b = before.get(id);
    if (id === skip) return;
    const c = +el.dataset.i % COLS, r = rowOf(+el.dataset.i);
    if (b) {
      const dx = b.left - a.left, dy = b.top - a.top;
      if (Math.abs(dx) + Math.abs(dy) < 1) return;
      el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "translate(0, 0)" }],
        { duration: (420 + Math.min(Math.hypot(dx, dy), 500) * .6) * slow, delay: dy < 0 ? 0 : c * 30, easing: "cubic-bezier(.3, 1.12, .5, 1)", fill: "backwards" });
    } else if (fresh.has(id)) {
      const dy = -(a.bottom - top) - 12;
      el.animate([{ transform: `translateY(${dy}px)`, opacity: 0 }, { opacity: 1, offset: .2 }, { transform: "translateY(0)", opacity: 1 }],
        { duration: (650 + (a.bottom - top) * .4) * slow, delay: 250 + c * 70 + (ROWS - r) * 40, easing: "cubic-bezier(.3, 1.1, .5, 1)", fill: "backwards" });
    }
  });
}

function boardTick(dt, now) {
  if (!B || B.over) return;
  const frozen = now < B.frozenUntil;
  const t = $("#timer");
  if (B.timed) {
    if (!frozen) B.timeLeft -= dt;
    if (t) {
      t.querySelector(".t").textContent = fmt(Math.ceil(B.timeLeft));
      t.classList.toggle("frozen", frozen);
      t.classList.toggle("low", !frozen && B.timeLeft <= 30);
    }
    if (B.timeLeft <= 0) endBoard(false);
  } else {
    B.elapsed += dt;
    if (t) t.querySelector(".t").textContent = fmt(B.elapsed);
  }
  if ((B.saveTick = (B.saveTick || 0) + dt) > 3) { B.saveTick = 0; saveBoard(); }
}

function renderBoardScreen() {
  const L = B.level;
  app.innerHTML = `
  <div class="screen">
    ${gameHeader("board", `${tr("Level {n}", { n: levelNo(B.levelIdx) })} · ${esc(tr(L.difficulty))}`,
      `<div class="timer" id="timer" aria-label="${B.timed ? "Time left" : "Time taken"}">${ICONS.clock}<span class="t">${fmt(B.timed ? B.timeLeft : B.elapsed)}</span></div>`)}
    <div class="sub">
      <span class="hint-text">${L.anagrams ? tr("Anagram round: ↻ words are scrambled") : tr("Put five connected tiles in one row")}</span>
      <span class="counter" aria-label="Groups found"><span class="stack"><i></i><i></i><i></i></span><span id="count"></span></span>
    </div>
    <div class="stage"><div class="board" id="board"></div></div>
    <div class="tools">
      <div class="tool-wrap"><button class="tool" id="hintBtn" aria-label="Hint: show two tiles that connect">${ic("bulb")}<span class="n" id="hintN"></span></button><span class="tool-label">${tr("Hint")}</span></div>
      ${B.timed ? `<div class="tool-wrap"><button class="tool" id="freezeBtn" aria-label="Freeze the clock for 30 seconds">${ic("snow")}<span class="n" id="freezeN"></span></button><span class="tool-label">${tr("Freeze")}</span></div>` : ""}
      <div class="tool-wrap"><button class="tool" id="shuffleBtn" aria-label="Shuffle the board">${ic("shuffle")}</button><span class="tool-label">${tr("Shuffle")}</span></div>
    </div>
  </div>`;
  $("#back").onclick = () => { saveBoard(); showHome(); };
  $("#help").onclick = () => showHelp("board");
  $("#hintBtn").onclick = useHint;
  if (B.timed) $("#freezeBtn").onclick = useFreeze;
  $("#shuffleBtn").onclick = () => {
    if (B.busy || B.over) return;
    const before = tileRects();
    const slots = playable().filter(i => B.board[i] != null);
    const ids = shuffle(slots.map(i => B.board[i]));
    slots.forEach((s, k) => B.board[s] = ids[k]);
    breakCompleteRows(); B.sel = null;
    renderBoard(); flip(before); saveBoard();
  };
  bindDrag($("#board"));
  renderBoard();
}

function renderBoard() {
  const el = $("#board"); if (!el) return;
  let html = "";
  const bandRows = new Map();
  for (let r = playRows(); r < ROWS; r++) bandRows.set(r, lockedGroupAt(r));
  (B.completing || []).forEach(c => bandRows.set(c.row, c.group));
  bandRows.forEach((gid, row) => {
    const g = B.groups[gid];
    const isNew = B.completing && B.completing.some(c => c.row === row);
    html += `<div class="band ${isNew ? "new" : ""}" style="grid-row:${row + 1};--c:${g.colour}"><span>${esc(g.name)}</span></div>`;
  });
  // Rows that have emptied completely (once the hidden words run out) disappear, so the board shrinks from the top.
  let emptyTop = 0;
  while (emptyTop < playRows() && rowIds(emptyTop).every(x => x == null)) emptyTop++;
  for (let i = 0; i < SIZE; i++) {
    const id = B.board[i], r = rowOf(i), c = i % COLS;
    const pos = `grid-row:${r + 1};grid-column:${c + 1}`;
    if (id == null) { html += `<div class="slot empty ${r < emptyTop ? "gone" : ""}" data-i="${i}" style="${pos}"></div>`; continue; }
    const t = T(id);
    const cls = [];
    let style = "";
    if (t.symbolOf != null) cls.push("symbol");
    if (B.sel === i) cls.push("sel");
    const shown = bandRows.has(r);
    if (shown) { cls.push("grouped"); style = `--c:${B.groups[bandRows.get(r)].colour}`; }
    else if (B.hintTiles.includes(id)) cls.push("hinted");
    if (t.anagram) {
      if (!shown) cls.push("anag");
      else if (!B.unravelled.has(id)) { cls.push("unravel"); B.unravelled.add(id); }
    }
    if (B.born === id) cls.push("born");
    html += `<div class="slot" data-i="${i}" style="${pos}"><div class="tile ${cls.join(" ")}" style="${style}" data-i="${i}" data-id="${id}" tabindex="0" aria-label="${esc(faceLabel(t, shown))}">${tileFace(t, shown)}</div></div>`;
  }
  el.innerHTML = html;
  B.born = null;
  $("#count").textContent = `${B.solved.size}/${B.groups.length}`;
  const hw = hintWallet();
  $("#hintN").textContent = hw.n; $("#hintBtn").classList.toggle("empty", !hw.n);
  if (B.timed) { $("#freezeN").textContent = B.freezes; $("#freezeBtn").disabled = !B.freezes; }
}

function swapSlots(a, b, dragged = false) {
  if (a === b || B.busy || B.over || isLocked(a) || isLocked(b)) return;
  const before = tileRects();
  const movedId = B.board[a];
  [B.board[a], B.board[b]] = [B.board[b], B.board[a]];
  B.sel = null;
  // Moving a tile into a gap leaves a hole behind; let everything above it fall.
  if (B.board[a] == null || B.board[b] == null) gravity();
  const done = [];
  for (let r = 0; r < playRows(); r++) { const g = rowComplete(r); if (g != null) done.push({ row: r, group: g }); }
  if (done.length) {
    B.busy = true; B.completing = done;
    const found = new Set(done.map(d => d.group));
    if (B.hintTiles.some(t => found.has(T(t).parent))) B.hintTiles = [];
  }
  renderBoard();
  flip(before, new Set(), dragged ? movedId : null);
  if (!done.length) return saveBoard();
  const cur = B;
  setTimeout(() => { if (B === cur) resolveRows(done); }, unravelPause(done));
}

// Give a scrambled word time to unscramble before the row moves on.
const unravelPause = rows => rows.some(d => rowIds(d.row).some(id => id != null && T(id).anagram)) ? 1700 : 1000;

function resolveRows(done) {
  const subs = done.filter(d => B.groups[d.group].parent != null);
  const SQUISH = reduceMotion() ? 500 : 900;
  // Groups that belong to a bigger answer: the five tiles slide together, then shrink into the picture.
  subs.forEach(d => {
    for (let c = 0; c < COLS; c++) {
      const tile = $(`#board .tile[data-i="${d.row * COLS + c}"]`);
      if (!tile) continue;
      tile.animate([
        { transform: "translateX(0) scale(1)", opacity: 1 },
        { transform: `translateX(${(2 - c) * 104}%) scale(1)`, opacity: 1, offset: .6 },
        { transform: `translateX(${(2 - c) * 104}%) scale(.1)`, opacity: 0 },
      ], { duration: SQUISH, easing: "cubic-bezier(.45, 0, .25, 1)", fill: "forwards" });
    }
    const band = $(`#board .band[style*="grid-row:${d.row + 1};"]`);
    if (band) band.animate([{ opacity: 1 }, { opacity: 1, offset: .6 }, { opacity: 0 }], { duration: SQUISH, fill: "forwards" });
  });
  const cur = B;
  setTimeout(() => {
    if (B !== cur) return;
    const before = tileRects();
    const tops = done.filter(d => B.groups[d.group].parent == null).sort((a, b) => a.row - b.row);
    subs.forEach(d => {
      const g = B.groups[d.group];
      B.solved.add(g.id);
      for (let c = 0; c < COLS; c++) B.board[d.row * COLS + c] = null;
      B.board[d.row * COLS + 2] = g.symbolTile;
      B.born = g.symbolTile;
      toast(`${g.pic} ${g.name}`);
    });
    if (tops.length) {
      // Finished groups with nothing above them settle at the bottom as full-colour rows.
      const P = playRows();
      const rows = [...Array(ROWS).keys()].map(rowIds);
      const topRows = new Set(tops.map(d => d.row));
      const keep = rows.slice(0, P).filter((_, r) => !topRows.has(r));
      tops.forEach(d => B.solved.add(d.group));
      B.lockedList = [...tops.map(d => d.group), ...B.lockedList];
      B.board = [...keep.flat(), ...tops.map(d => rows[d.row]).flat(), ...rows.slice(P).flat()];
      toast(tr("{name} complete!", { name: B.groups[tops[0].group].name }));
    }
    B.completing = null;
    if (B.solved.size === B.groups.length) { B.busy = false; renderBoard(); flip(before); return setTimeout(() => { if (B === cur) endBoard(true); }, 900); }
    const fresh = refill();
    // Near the end the last rows can only be filled one way; if a row is already complete, play it out.
    const auto = [];
    for (let r = 0; r < playRows(); r++) { const g = rowComplete(r); if (g != null) auto.push({ row: r, group: g }); }
    B.busy = false;
    renderBoard();
    flip(before, fresh);
    if (auto.length) {
      B.busy = true; B.completing = auto;
      setTimeout(() => { if (B !== cur) return; renderBoard(); setTimeout(() => { if (B === cur) resolveRows(auto); }, unravelPause(auto)); }, 1300);
    } else saveBoard();
  }, subs.length ? SQUISH : 0);
}

// Hint: light up two tiles on the board that belong together.
function useHint() {
  if (B.busy || B.over) return;
  if (!hintWallet().n) return toast(tr("No hints left. More in {t}.", { t: hintWait() }));
  const onBoard = new Set(B.board.filter(x => x != null));
  const full = B.groups.filter(g => !B.solved.has(g.id) && g.memberTiles.every(t => onBoard.has(t)));
  if (!full.length || !spendHint()) return;
  const g = pick(full);
  // Prefer two tiles that are not already sharing a row, so the hint tells you something new.
  const members = shuffle([...g.memberTiles]);
  const first = members[0];
  const second = members.find(t => t !== first && rowOf(B.board.indexOf(t)) !== rowOf(B.board.indexOf(first))) || members[1];
  B.hintsUsed++; B.hintTiles = [first, second];
  renderBoard(); saveBoard();
}
function useFreeze() {
  if (!B.freezes || B.over) return;
  B.freezes--; B.frozenUntil = Math.max(performance.now(), B.frozenUntil) + 30000;
  toast(tr("Clock frozen for 30 seconds"));
  renderBoard(); saveBoard();
}

function endBoard(won) {
  if (B.over) return;
  B.over = true; stopTicking();
  const key = bkey(B.levelIdx);
  store.set("save-" + key, undefined);
  const score = B.timed ? Math.ceil(B.timeLeft) : Math.floor(B.elapsed);
  if (won) {
    store.set("done-" + key, true);
    const prev = store.get()["best-" + key];
    if (prev == null || (B.timed ? score > prev : score < prev)) store.set("best-" + key, score);
    confetti();
  }
  const name = esc(playerName());
  const next = won ? nextBoard() : null;
  const ov = document.createElement("div"); ov.className = "overlay";
  // A failed level never shows the answers: the player starts it again with a fresh deal.
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" ${sheetStyle("board")}>
    ${sheetBadge(won ? "trophy" : "clock")}
    <h2>${won ? `${tr(pick(["Brilliant", "Well done", "Superb", "Nice work"]))}${name ? ", " + name : ""}!` : `${tr("Time's up")}${name ? ", " + name : ""}`}</h2>
    <p>${won ? tr("You found all {n} connections.", { n: B.groups.length }) : tr("You found {a} of {b} connections. This level starts again from the beginning, with a fresh deal.", { a: B.solved.size, b: B.groups.length })}</p>
    <div class="stats">
      <div class="stat"><b>${B.solved.size}/${B.groups.length}</b><span>${tr("Connections")}</span></div>
      <div class="stat"><b>${B.timed ? fmt(won ? B.timeLeft : 0) : fmt(B.elapsed)}</b><span>${B.timed ? tr("Time to spare") : tr("Time taken")}</span></div>
      <div class="stat"><b>${B.hintsUsed}</b><span>${tr("Hints used")}</span></div>
    </div>
    <div class="actions">
      ${won ? (next != null ? `<button class="btn primary" id="next">${tr("Level {n}", { n: levelNo(next) })}</button>` : "") : `<button class="btn primary" id="again">${tr("Restart level")}</button>`}
      <button class="btn" id="menu">${tr("Home")}</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  const lvl = B.levelIdx;
  if (won && next != null) $("#next", ov).onclick = () => startBoard(next);
  if (!won) $("#again", ov).onclick = () => startBoard(lvl);
  $("#menu", ov).onclick = () => showHome();
}

/* Drag and drop, plus tap one tile then tap another to swap. */
function bindDrag(board) {
  let drag = null;
  const slotAt = (x, y) => { const el = document.elementFromPoint(x, y); const s = el && el.closest(".slot"); return s && board.contains(s) ? +s.dataset.i : null; };
  board.addEventListener("pointerdown", e => {
    const tile = e.target.closest(".tile");
    if (!tile || B.busy || B.over) return;
    const i = +tile.dataset.i;
    if (isLocked(i)) return;
    drag = { i, x: e.clientX, y: e.clientY, moved: false, tile, ghost: null, target: null, pid: e.pointerId };
    try { board.setPointerCapture(e.pointerId); } catch {}
  });
  board.addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== drag.pid) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) {
      drag.moved = true;
      const r = drag.tile.getBoundingClientRect();
      const g = document.createElement("div"); g.className = "ghost";
      g.style.width = r.width + "px"; g.style.height = r.height + "px";
      g.style.fontSize = getComputedStyle(drag.tile).fontSize; g.innerHTML = drag.tile.innerHTML;
      const pic = g.querySelector(".pic"); if (pic) pic.style.fontSize = getComputedStyle(drag.tile.querySelector(".pic")).fontSize;
      document.body.appendChild(g); drag.ghost = g;
      drag.tile.classList.add("lifted"); B.sel = null;
      board.querySelectorAll(".tile.sel").forEach(t => t.classList.remove("sel"));
    }
    if (drag.moved) {
      drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px";
      const t = slotAt(e.clientX, e.clientY);
      if (t !== drag.target) {
        board.querySelectorAll(".slot.target").forEach(s => s.classList.remove("target"));
        drag.target = t;
        if (t != null && t !== drag.i && !isLocked(t)) board.querySelector(`.slot[data-i="${t}"]`).classList.add("target");
      }
    }
  });
  const finish = e => {
    if (!drag || e.pointerId !== drag.pid) return;
    const d = drag; drag = null;
    if (d.ghost) d.ghost.remove();
    if (d.moved) {
      d.tile.classList.remove("lifted");
      board.querySelectorAll(".slot.target").forEach(s => s.classList.remove("target"));
      if (e.type === "pointerup" && d.target != null && d.target !== d.i && !isLocked(d.target)) swapSlots(d.i, d.target, true);
      return;
    }
    if (e.type !== "pointerup") return;
    if (B.sel == null) { B.sel = d.i; renderBoard(); }
    else if (B.sel === d.i) { B.sel = null; renderBoard(); }
    else swapSlots(B.sel, d.i);
  };
  board.addEventListener("pointerup", finish);
  board.addEventListener("pointercancel", finish);
  board.addEventListener("click", e => {
    const s = e.target.closest(".slot.empty");
    if (s && B.sel != null) swapSlots(B.sel, +s.dataset.i);
  });
  board.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("tile")) {
      e.preventDefault(); const i = +e.target.dataset.i;
      if (isLocked(i)) return;
      if (B.sel == null) B.sel = i; else if (B.sel === i) B.sel = null; else return swapSlots(B.sel, i);
      renderBoard(); board.querySelector(`.tile[data-i="${i}"]`)?.focus();
    }
  });
}

/* =====================================================================
   WALL MODE (Only Connect style)
   ===================================================================== */
let W = null;

function startWall(idx) {
  leaveGame();
  const wall = WALLS[idx];
  const clues = [];
  wall.groups.forEach((g, gi) => g.tiles.forEach(text => clues.push({ id: clues.length, group: gi, text: locWall(text) })));
  W = { idx, wall, clues, order: shuffle(clues.map(c => c.id)), found: [], sel: [], lives: null,
        timeLeft: 180, over: false, busy: false, revealed: new Set(), credited: new Set(), endReason: "" };
  const saved = store.get()["save-wall-" + idx];
  if (saved && saved.order.length === clues.length) {
    Object.assign(W, { order: saved.order, found: saved.found, lives: saved.lives, timeLeft: saved.timeLeft });
    toast("Welcome back. Carrying on where you left off.");
  }
  renderWallScreen();
  saveWall();
  startTicking(wallTick);
}
function saveWall() {
  if (!W || W.over) return;
  store.set("save-wall-" + W.idx, { order: W.order, found: W.found, lives: W.lives, timeLeft: W.timeLeft });
}

function wallTick(dt) {
  if (!W || W.over) return;
  W.timeLeft -= dt;
  const t = $("#timer");
  if (t) { t.querySelector(".t").textContent = fmt(Math.ceil(W.timeLeft)); t.classList.toggle("low", W.timeLeft <= 30); }
  if (W.timeLeft <= 0) return endWall("Time's up");
  if ((W.saveTick = (W.saveTick || 0) + dt) > 2) { W.saveTick = 0; saveWall(); }
}

function renderWallScreen() {
  app.innerHTML = `
  <div class="screen">
    ${gameHeader("wall", `Level ${W.idx + 1}`, `<div class="timer" id="timer" aria-label="Time left">${ICONS.clock}<span class="t">${fmt(W.timeLeft)}</span></div>`)}
    <div class="sub"><span class="hint-text" id="wallMsg"></span><span class="lives" id="lives"></span></div>
    <div class="wall-stage"><div class="wall" id="wall"></div></div>
  </div>`;
  $("#back").onclick = () => { saveWall(); showHome(); };
  $("#help").onclick = () => showHelp("wall");
  $("#wall").addEventListener("click", e => { const b = e.target.closest(".wtile"); if (b) tapClue(+b.dataset.id); });
  renderWall();
}

function renderWall() {
  const el = $("#wall"); if (!el) return;
  const foundIds = W.found.flatMap(g => W.clues.filter(c => c.group === g).map(c => c.id));
  const rest = W.order.filter(id => !foundIds.includes(id));
  let html = "";
  W.found.forEach((g, k) => W.clues.filter(c => c.group === g).forEach(c => {
    const auto = W.revealedGroups && W.revealedGroups.includes(g);
    html += `<button class="wtile found ${auto ? "revealed" : ""} ${g === W.justFound ? "new" : ""}" style="--c:${WALL_COLOURS[k]}" data-id="${c.id}" aria-disabled="true"><span class="tx">${esc(c.text)}</span></button>`;
  }));
  W.justFound = null;
  rest.forEach(id => html += `<button class="wtile ${W.sel.includes(id) ? "sel" : ""}" data-id="${id}" aria-pressed="${W.sel.includes(id)}"><span class="tx">${esc(W.clues[id].text)}</span></button>`);
  el.innerHTML = html;
  fitText(el, ".wtile");
  const msg = $("#wallMsg");
  if (W.over) msg.textContent = W.endReason;
  else if (W.lives == null) msg.textContent = W.found.length ? `Nice! ${W.found.length} group${W.found.length > 1 ? "s" : ""} found. Keep going.` : "Tap four clues that belong together.";
  else msg.textContent = "Careful now: from here, each wrong guess loses a life.";
  $("#lives").innerHTML = W.lives == null ? "" : `Lives ${[0, 1, 2].map(i => ICONS.heart.replace('class="heart"', `class="heart ${i < W.lives ? "" : "gone"}"`)).join("")}`;
}

function tapClue(id) {
  if (W.over || W.busy) return;
  if (W.found.includes(W.clues[id].group)) return;
  const i = W.sel.indexOf(id);
  if (i >= 0) W.sel.splice(i, 1); else W.sel.push(id);
  if (W.sel.length < 4) return renderWall();
  const g = W.clues[W.sel[0]].group;
  if (W.sel.every(x => W.clues[x].group === g)) {
    W.found.push(g); W.sel = []; W.justFound = g;
    if (W.found.length === 2 && W.lives == null) { W.lives = 3; toast("Two groups found! Now you have three lives left for the rest."); }
    if (W.found.length === 3) {
      const last = [0, 1, 2, 3].find(x => !W.found.includes(x));
      W.found.push(last);
      renderWall();
      return endWall("Wall solved!");
    }
    renderWall(); saveWall();
  } else {
    W.busy = true; renderWall();
    const el = $("#wall"); el.classList.add("shake");
    if (W.lives != null) W.lives--;
    const cur = W;
    setTimeout(() => {
      if (W !== cur) return;
      el.classList.remove("shake"); W.sel = []; W.busy = false;
      if (W.lives === 0) { renderWall(); endWall("Out of lives"); } else { renderWall(); saveWall(); }
    }, 480);
  }
}

function endWall(reason) {
  if (W.over) return;
  W.over = true; W.endReason = reason; stopTicking();
  store.set("save-wall-" + W.idx, undefined);
  W.groupsScored = W.found.length;
  W.sel = [];
  renderWall();
  const cur = W;
  if (W.found.length < 4) {
    // Not solved: no answers shown. The wall is reshuffled for another go.
    const name = esc(playerName());
    const ov = document.createElement("div"); ov.className = "overlay";
    ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" ${sheetStyle("wall")}>
      ${sheetBadge("wall")}
      <h2>${esc(reason)}${name ? ", " + name : ""}</h2>
      <p>You found ${W.found.length} of 4 groups. Have another go: the wall starts again, reshuffled.</p>
      <div class="actions"><button class="btn primary" id="again">Try again</button><button class="btn" id="menu">Home</button></div>
    </div>`;
    setTimeout(() => { if (W !== cur) return; document.body.appendChild(ov); }, 700);
    $("#again", ov).onclick = () => startWall(cur.idx);
    $("#menu", ov).onclick = () => showHome();
    return;
  }
  store.set("done-wall-" + W.idx, true);
  confetti();
  setTimeout(() => { if (W === cur) showWallResults(); }, 900);
}

function wallScore() {
  const conns = W.credited.size;
  return W.groupsScored + conns + (W.groupsScored === 4 && conns === 4 ? 2 : 0);
}

function showWallResults() {
  const ov = document.createElement("div"); ov.className = "overlay";
  const save = () => { const k = "best-wall-" + W.idx, prev = store.get()[k]; if (prev == null || wallScore() > prev) store.set(k, wallScore()); };
  const next = nextWall();
  const draw = () => {
    ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" ${sheetStyle("wall")}>
      ${sheetBadge("trophy")}
      <h2>${esc(W.endReason)}</h2>
      <p>You get a point for every group you found. Now, did you know what links each group? Tap Reveal to see the answer, and give yourself a point if you got it. Get all eight points and you earn 2 bonus points.</p>
      ${W.found.map((g, k) => {
        const words = W.clues.filter(c => c.group === g).map(c => c.text).join(", ");
        const shown = W.revealed.has(g);
        return `<div class="conn" style="--c:${WALL_COLOURS[k]}"><span class="sw"></span>
          <span class="name ${shown ? "" : "hidden"}">${shown ? esc(locWall(W.wall.groups[g].name)) : "Connection hidden"}</span>
          <span class="ctl">${shown ? `<button class="pill-btn ${W.credited.has(g) ? "on" : ""}" data-credit="${g}">${W.credited.has(g) ? "Got it ✓" : "I had it"}</button>` : `<button class="pill-btn" data-reveal="${g}">Reveal</button>`}</span>
          <span class="words">${esc(words)}</span></div>`;
      }).join("")}
      <div class="stats">
        <div class="stat"><b>${W.groupsScored}</b><span>Groups</span></div>
        <div class="stat"><b>${W.credited.size}</b><span>Connections</span></div>
        <div class="stat"><b>${wallScore()}</b><span>Total / 10</span></div>
      </div>
      <div class="actions">
        ${next != null ? `<button class="btn primary" id="next">Level ${next + 1}</button>` : ""}
        <button class="btn" id="menu">Home</button>
      </div>
    </div>`;
    ov.querySelectorAll("[data-reveal]").forEach(b => b.onclick = () => { W.revealed.add(+b.dataset.reveal); draw(); });
    ov.querySelectorAll("[data-credit]").forEach(b => b.onclick = () => { const g = +b.dataset.credit; W.credited.has(g) ? W.credited.delete(g) : W.credited.add(g); save(); draw(); });
    if (next != null) $("#next", ov).onclick = () => { save(); startWall(next); };
    $("#menu", ov).onclick = () => { save(); showHome(); };
  };
  save();
  draw();
  document.body.appendChild(ov);
}

/* =====================================================================
   DAILY GAMES
   The date picks the puzzle, so everyone gets the same one each day,
   with no server. A new puzzle arrives at midnight, local time.
   ===================================================================== */
const dateKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const yesterdayKey = () => { const d = new Date(); d.setDate(d.getDate() - 1); return dateKey(d); };
const ofDay = (list, n) => list[((n % list.length) + list.length) % list.length];
const todayKey = () => dateKey(new Date());
const dayNumber = () => { const d = new Date(); return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(2026, 9, 1)) / 864e5); };
const ofToday = list => ofDay(list, dayNumber());
const todayLabel = () => new Date().toLocaleDateString(isUS() ? "en-US" : isFR() ? "fr-FR" : "en-GB", { weekday: "long", day: "numeric", month: "long" });
function dailyKeys(onKey) {
  return k => `<div class="keys">${["qwertyuiop", "asdfghjkl+", "zxcvbnm-"].map(row => `<div class="krow">${[...row].map(c =>
    c === "+" ? `<button class="key wide" data-k="Enter">Enter</button>` : c === "-" ? `<button class="key wide" data-k="Backspace" aria-label="Delete">${ic("del")}</button>` :
    `<button class="key ${k[c] || ""}" data-k="${c}">${c}</button>`).join("")}</div>`).join("")}</div>`;
}
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || document.querySelector(".overlay")) return;
  if (e.target.closest && e.target.closest("input, textarea")) return;
  const arrow = e.key === "ArrowLeft" || e.key === "ArrowRight";
  const k = e.key === "Enter" || e.key === "Backspace" || arrow ? e.key : /^[a-zA-Z]$/.test(e.key) ? e.key.toLowerCase() : null;
  if (!k) return;
  // Enter on a focused button should press that button, not submit.
  if (k === "Enter" && (S || K) && e.target.closest && e.target.closest("button.btn, button.gpill, button.round")) return;
  if (D && !arrow) { e.preventDefault(); fiveKey(k); } else if (H && !arrow) { e.preventDefault(); wheelKey(k); }
  else if (S) { e.preventDefault(); stepsKey(k); } else if (K) { e.preventDefault(); lockKey(k); }
});

/* ---------- Daily Five: guess the five-letter word in six tries ---------- */
let D = null;
const fiveAnswer = () => ofToday(FIVE_ANSWERS);
const fiveState = () => store.get()["five-" + todayKey()] || { guesses: [], over: false, won: false };
function fiveStats() {
  const s = store.get().fiveStats || { played: 0, won: 0, streak: 0, best: 0, lastWin: null, dist: [0, 0, 0, 0, 0, 0] };
  return { ...s, streak: s.lastWin != null && dayNumber() - s.lastWin <= 1 ? s.streak : 0 };
}
// Colours for one guess: c = right letter, right place; p = in the word, wrong place; a = not in the word.
function fiveScore(guess, answer) {
  const res = Array(5).fill("a"), left = {};
  [...answer].forEach((c, i) => { if (guess[i] === c) res[i] = "c"; else left[c] = (left[c] || 0) + 1; });
  [...guess].forEach((c, i) => { if (res[i] !== "c" && left[c]) { res[i] = "p"; left[c]--; } });
  return res;
}
function startFive() {
  leaveGame();
  D = { answer: fiveAnswer(), ...fiveState(), typed: "", busy: false };
  app.innerHTML = `
  <div class="screen daily">
    ${gameHeader("five", esc(todayLabel()), `<span class="gpill" aria-label="Daily Five streak">${ic("flame")}${fiveStats().streak}</span>`)}
    <p class="daily-msg" id="msg">Guess today's five-letter word. You have six tries.</p>
    <div class="fgrid" id="fgrid"></div>
    <div class="legend" aria-hidden="true"><span><i class="c"></i>Right place</span><span><i class="p"></i>In the word</span><span><i class="a"></i>Not in it</span></div>
    <div id="keys"></div>
  </div>`;
  $("#back").onclick = () => showHome();
  $("#help").onclick = () => showHelp("five");
  $("#keys").addEventListener("click", e => { const b = e.target.closest(".key"); if (b) fiveKey(b.dataset.k); });
  renderFive();
  if (D.over) setTimeout(() => D && fiveResult(), 400);
}
function renderFive(revealRow = -1) {
  const rows = [];
  for (let r = 0; r < 6; r++) {
    const g = D.guesses[r], sc = g ? fiveScore(g, D.answer) : null;
    const text = g || (r === D.guesses.length ? D.typed : "");
    rows.push(`<div class="frow ${r === D.guesses.length && D.shake ? "shake" : ""}">${[0, 1, 2, 3, 4].map(i =>
      `<div class="ft ${sc ? sc[i] : text[i] ? "typed" : ""} ${r === revealRow ? "flip" : ""}" style="--d:${i * 0.25}s">${text[i] || ""}</div>`).join("")}</div>`);
  }
  $("#fgrid").innerHTML = rows.join("");
  const k = {};
  D.guesses.forEach(g => fiveScore(g, D.answer).forEach((r, i) => { const c = g[i], rank = { c: 3, p: 2, a: 1 }; if (!k[c] || rank[r] > rank[k[c]]) k[c] = r; }));
  $("#keys").innerHTML = dailyKeys()(k);
  D.shake = false;
}
function fiveKey(k) {

let H = null;

/* =====================================================================
   WORD STEPS
   Change one letter at a time to turn the start word into the target.

   ===================================================================== */
let S = null;

function stepsWords() {

    const near = w => { const out = []; for (let i = 0; i < w.length; i++) for (const n of buckets.get(w.slice(0, i) + "_" + w.slice(i + 1)) || []) if (n !== w) out.push(n); return out; };

// Distance from every word to the target (cached per target).

const stepsDiff = (a, b) => [...a].filter((c, i) => c !== b[i]).length;
const stepsCur = () => S.words[S.words.length - 1];

function startSteps(idx, daily = false) {
  leaveGame();

  S = { idx, daily, level, words: [level.start], hints: 0, edit: [...level.start], sel: 0, hintPos: null, msg: "", over: false };
  const cur = dayState("steps").cur;
  const saved = daily ? (cur && cur.k === idx ? cur : null) : store.get()["save-steps-" + idx];
  if (saved && saved.v === 1 && saved.words && saved.words[0] === level.start) { S.words = saved.words; S.hints = saved.hints || 0; S.edit = [...stepsCur()]; S.msg = "Welcome back. Carrying on where you left off."; }
  app.innerHTML = `
  <div class="screen daily steps-screen" style="--c:${GAMES.steps.c}">
    ${gameHeader("steps", daily ? `Today · ${level.difficulty} · ${idx + 1} of 3` : `Level ${idx + 1} · ${level.difficulty}`, levelsPill())}
    <div class="steps-body">
      <div class="ladder" id="ladder" aria-live="polite"></div>
      <p class="daily-msg" id="msg"></p>
      <div class="steps-btns">
        <button class="btn" id="sUndo">${ic("back")}Undo</button>
        <button class="btn clue-btn" id="sHint">${ic("bulb")}Hint <span id="sHintN"></span></button>
        <button class="btn" id="sRestart">Restart</button>

function saveSteps() {

function stepsKey(k) {
  if (!S || S.over) return;

  S.edit = [...cur]; S.edit[S.sel] = k;

/* =====================================================================
   LETTER LOCK
   A phrase where every letter is swapped for a number. Same number,

let K = null;
const lockNum = (lv, ch) => lv.key.charCodeAt(ch.charCodeAt(0) - 65) - 64;

  const nums = [...new Set([...text].filter(c => /[A-Z]/.test(c)).map(c => lockNum(level, c)))];
  const answer = {}; [...text].forEach(c => { if (/[A-Z]/.test(c)) answer[lockNum(level, c)] = c; });

  if (saved && saved.v === 1) {
    Object.assign(K, { guess: { ...K.guess, ...saved.guess }, hints: saved.hints || 0, checks: saved.checks || 0, clue: !!saved.clue });

  <div class="screen daily lock-screen" style="--c:${GAMES.lock.c}">
    ${gameHeader("lock", daily ? `Today · ${level.difficulty} · ${idx + 1} of 3` : `Level ${idx + 1} · ${level.difficulty}`, levelsPill())}
    <div class="lock-body">
      <div class="lock-main">
        <div class="phrase" id="phrase" role="group" aria-label="The coded phrase"></div>
        <p class="lock-clue" id="clue" hidden></p>
        <p class="daily-msg" id="msg"></p>
        <div class="steps-btns">
          <button class="btn" id="kClear">Clear letter</button>
          <button class="btn clue-btn" id="kHint">${ic("bulb")}Hint <span id="kHintN"></span></button>
          <button class="btn primary" id="kCheck">Check answer</button>
          <button class="btn" id="kReset">Reset</button>
        </div>
      </div>
      <aside class="lock-ref" id="ref" aria-label="Your letters so far"></aside>
    </div>

  $("#ref").innerHTML = `<h4>Your letters <span>${Object.keys(K.guess).length} of ${K.nums.length}</span></h4>

  const clue = $("#clue"); clue.hidden = !K.clue; clue.innerHTML = `${ic("bulb")} Clue: ${esc(K.level.clue)}`;

function lockKey(k) {

  if (K.nums.every(n => K.guess[n] === K.answer[n])) return lockComplete();

// Hints: reveal the most useful letter (the one that appears most), and the third hint gives a clue to the subject.

  if (!K || K.over) return;
  if (!potLeft("lock")) { K.msg = "No hints left today. You get 3 more tomorrow."; return renderLock(); }
  if (K.hints === 2 && !K.clue) { K.hints++; usePot("lock"); K.clue = true; K.msg = "Here's a clue to the subject."; saveLock(); return renderLock(); }
  const count = n => [...K.text].filter(c => /[A-Z]/.test(c) && lockNum(K.level, c) === n).length;
  const todo = K.nums.filter(n => !K.revealed.has(n) && K.guess[n] !== K.answer[n]).sort((a, b) => count(b) - count(a));

function lockComplete() {
  K.over = true;
  const h = K.hints, c = K.checks, stars = h === 0 && c === 1 ? 3 : h <= 2 ? 2 : 1;
  if (K.daily) { const st = dayState("lock"); st.res[K.idx] = { stars, hints: h, checks: c }; st.stage = Math.max(st.stage, K.idx + 1); st.cur = null; daySet("lock", st); }
  else { store.set("save-lock-" + K.idx, undefined); saveBest("lock", K.idx, { stars, hints: h, checks: c }); }
  K.sel = null; K.msg = "Code cracked!"; renderLock(); confetti();
  const i = K.idx;
  const show = K.daily ? dailyResult : levelResult;
  setTimeout(() => K && K.idx === i && show("lock", i, "Code cracked!", "Here's the hidden phrase:", stars, [[h, "Hints used"], [c, "Answer checks"]],
    `<p class="cracked">“${esc(K.level.text)}”</p>`), 700);
}

// Save on the way out, so closing the app or switching away never loses progress.
addEventListener("pagehide", () => { saveBoard(); saveWall(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) { saveBoard(); saveWall(); } });

// Stop pinch and double-tap zoom on iPad, which gets in the way of quick tapping.
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("dblclick", e => e.preventDefault());

applyCalm();
showHome();
cloud.start();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
