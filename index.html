<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linkboard</title>
<meta name="description" content="An ad-free word connection game with a Board mode and an Only Connect style Wall mode.">
<meta name="theme-color" content="#0E3B3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Linkboard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap">
<style>
/* Layout: one-screen app on a green baize table. Header, then a stage that scales the board to fit. */
:root {
  color-scheme: dark;
  --felt: #0E3B3A;
  --felt-hi: #17625B;
  --felt-lo: #082624;
  --tray: rgba(3, 20, 19, .38);
  --on-felt: #EAF5F1;
  --muted: #9CC4BC;
  --tile: #FFF7E8;
  --tile-edge: #D6BF98;
  --ink: #2E241C;
  --gold: #F4C04E;
  --gold-edge: #B9862A;
  --danger: #FF7A6B;
  --ice: #7CC8FF;
  --font-display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-ui: "Fredoka", "Arial Rounded MT Bold", system-ui, -apple-system, sans-serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--felt-lo);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--on-felt); font-family: var(--font-ui); font-size: 15px;
  background:
    radial-gradient(120% 70% at 50% 0%, var(--felt-hi) 0%, transparent 70%),
    radial-gradient(90% 60% at 50% 110%, var(--felt-lo) 0%, transparent 70%),
    var(--felt);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overflow: hidden;
}
/* subtle felt grain */
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5; z-index: 0;
  background-image: radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
  background-size: 4px 4px;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .tile:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.app {
  position: relative; z-index: 1; height: 100%; max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }

/* ---------- Logo ---------- */
.logo { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.logo b {
  font-family: var(--font-display); font-weight: 400; font-size: 1.9rem; line-height: 1;
  width: 1.45em; height: 1.45em; display: grid; place-items: center; border-radius: .26em;
  background: var(--tile); color: var(--ink); box-shadow: 0 .14em 0 var(--tile-edge);
  animation: tileIn .5s cubic-bezier(.2,.9,.3,1.3) both;
}
.logo b.c { color: #fff; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 78%, #fff), var(--c) 70%); box-shadow: 0 .14em 0 color-mix(in srgb, var(--c) 60%, #000); }
.logo .gap { width: 8px; }
@keyframes tileIn { from { transform: translateY(-30px) rotate(-8deg); opacity: 0; } }

/* ---------- Home ---------- */
.home { overflow-y: auto; gap: 22px; padding-bottom: 28px; padding-top: 8px; }
.tagline { color: var(--muted); margin: -8px 0 0; font-size: 1.05rem; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 18px; align-items: start; }
.mode {
  background: var(--tray); border: 1px solid rgba(255,255,255,.07); border-radius: 22px; padding: 18px;
  display: flex; flex-direction: column; gap: 12px; box-shadow: inset 0 2px 12px rgba(0,0,0,.25);
}
.mode-head { display: flex; align-items: center; gap: 14px; }
.mini { display: grid; gap: 3px; flex: none; }
.mini.mb { grid-template-columns: repeat(5, 9px); }
.mini.mw { grid-template-columns: repeat(4, 11px); }
.mini i { height: 7px; border-radius: 2px; background: var(--tile); opacity: .85; }
.mini.mw i { height: 9px; }
.mini i.c { background: var(--c); opacity: 1; }
.mode h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; margin: 0; letter-spacing: .02em; }
.mode p { margin: 0; color: var(--muted); line-height: 1.45; font-size: .98rem; max-width: 50ch; }
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); gap: 10px; }
.level-btn {
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left;
  background: var(--tile); color: var(--ink); border: 0; border-radius: 14px; padding: 12px 14px 13px;
  box-shadow: 0 4px 0 var(--tile-edge); transition: transform .1s, box-shadow .1s;
}
.level-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tile-edge); }
.level-btn b { font-weight: 700; font-size: 1.02rem; }
.level-btn .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .8rem; color: #6F5F4E; font-weight: 600; }
.level-btn .best { font-size: .78rem; color: #8A7A66; font-weight: 600; }
.level-btn .best.done { color: #1E8A55; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; color: #fff; background: var(--c, #6F5F4E); }
.chip svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; }
.chip.plain { background: #EFE3CC; color: #6F5F4E; }

/* ---------- Game header ---------- */
.bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.icon-btn { width: 46px; height: 46px; border: 0; border-radius: 14px; background: var(--tray); display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.icon-btn svg { width: 22px; height: 22px; stroke: var(--on-felt); fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.title-block { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.title-block .lvl { font-family: var(--font-display); font-size: 1.4rem; line-height: 1; letter-spacing: .02em; }
.timer {
  justify-self: end; display: flex; align-items: center; gap: 8px; background: var(--tile); color: var(--ink);
  padding: 7px 14px 7px 10px; border-radius: 99px; font-weight: 700; font-size: 1.2rem; font-variant-numeric: tabular-nums;
  box-shadow: 0 3px 0 var(--tile-edge); transition: background .3s, color .3s;
}
.timer .dial { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); box-shadow: inset 0 -2px 0 var(--gold-edge); }
.timer .dial svg { width: 16px; height: 16px; stroke: var(--ink); fill: none; stroke-width: 2.6; stroke-linecap: round; }
.timer.relaxed .dial { background: #CFE9E1; box-shadow: inset 0 -2px 0 #9CC4BC; }
.timer.frozen { background: var(--ice); }
.timer.frozen .dial { background: #fff; box-shadow: none; }
.timer.low { color: #C92A2A; animation: tick 1s steps(1) infinite; }
@keyframes tick { 50% { transform: scale(1.05); } }
.sub { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 38px; }
.hint-text { color: var(--muted); font-size: 1rem; }
.counter {
  display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums;
  background: var(--tray); border-radius: 99px; padding: 6px 14px 6px 10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
}
.stack { position: relative; width: 24px; height: 20px; }
.stack i { position: absolute; left: 0; width: 24px; height: 9px; border-radius: 3px; }
.stack i:nth-child(1) { top: 11px; background: #2FA866; }
.stack i:nth-child(2) { top: 5.5px; background: #8A55E6; }
.stack i:nth-child(3) { top: 0; background: #E8553D; }

/* ---------- Board ---------- */
.stage { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; }
.board {
  width: min(100cqw, 152cqh); aspect-ratio: 1.52;
  background: var(--tray); border-radius: 2.4cqw; padding: 1.6%;
  box-shadow: inset 0 0.4cqw 1.6cqw rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.06);
  display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(7, 1fr); gap: 2.2% 1.6%;
  container-type: inline-size; touch-action: none; position: relative;
}
.slot { position: relative; z-index: 1; border-radius: 1.6cqw; min-width: 0; min-height: 0; }
.slot.empty { background: rgba(0,0,0,.18); box-shadow: inset 0 0.3cqw 0.8cqw rgba(0,0,0,.25); }
.slot.target::after { content: ""; position: absolute; inset: -0.5cqw; border-radius: 2cqw; border: 0.45cqw dashed var(--gold); }
.tile {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--ink);
  background: linear-gradient(180deg, #FFFDF7 0%, var(--tile) 55%);
  border-radius: 1.6cqw; box-shadow: 0 0.55cqw 0 var(--tile-edge), 0 0.9cqw 1.2cqw rgba(0,0,0,.18);
  font-weight: 600; font-size: 2.25cqw; letter-spacing: .05em; text-transform: uppercase; line-height: 1.1;
  padding: 0 .4em; cursor: grab; transition: transform .14s, box-shadow .14s, background .3s, color .3s;
  overflow: hidden; overflow-wrap: normal;
}
.tile .pic { font-size: 4.4cqw; line-height: 1; letter-spacing: 0; filter: drop-shadow(0 0.2cqw 0 rgba(0,0,0,.12)); }
.tile.symbol { background: radial-gradient(circle at 50% 40%, #FFFFFF 0%, #FFF3D9 75%); box-shadow: 0 0.55cqw 0 var(--gold-edge), 0 0 0 0.3cqw color-mix(in srgb, var(--gold) 70%, transparent) inset, 0 0.9cqw 1.2cqw rgba(0,0,0,.18); }
.tile.sel { transform: translateY(-0.6cqw) scale(1.03); box-shadow: 0 1.1cqw 0 var(--gold-edge), 0 0 0 0.45cqw var(--gold); }
.tile.lifted { opacity: .2; }
.tile.grouped {
  color: #fff; text-shadow: 0 0.15cqw 0 rgba(0,0,0,.25);
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 72%, #fff) 0%, var(--c) 62%);
  box-shadow: 0 0.55cqw 0 color-mix(in srgb, var(--c) 55%, #000); cursor: default;
}
.tile.flash { animation: flash .5s ease-out; }
@keyframes flash { 0% { transform: scale(1); } 40% { transform: scale(1.08); } }
.tile.hinted { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0.55cqw 0 var(--tile-edge), 0 0 0 0.7cqw rgba(244,192,78,.85); } }
.tile.drop { animation: drop .5s cubic-bezier(.2,.9,.3,1.25) both; }
@keyframes drop { from { transform: translateY(-140%) rotate(-4deg); opacity: 0; } }
.tile.squish { transition: transform .38s cubic-bezier(.5,0,.75,0), opacity .38s; transform: translateX(var(--dx)) scale(.35); opacity: 0; }
.tile.born { animation: born .55s cubic-bezier(.2,.9,.3,1.5) both; }
@keyframes born { from { transform: scale(.2) rotate(-20deg); } }
.tile.vanish { animation: vanish .3s ease-in both; }
@keyframes vanish { to { transform: scale(.6); opacity: 0; } }
.band {
  z-index: 0; grid-column: 1 / -1; margin: -1.2cqw -1cqw -0.6cqw; border-radius: 2cqw; position: relative;
  background: color-mix(in srgb, var(--c) 45%, #000); box-shadow: inset 0 0 0 0.3cqw color-mix(in srgb, var(--c) 80%, #fff);
  animation: bandIn .35s ease-out both;
}
.band span {
  position: absolute; top: -0.1cqw; left: 0; right: 0; text-align: center; color: #fff;
  font-size: 1.35cqw; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; line-height: 1.2;
}
@keyframes bandIn { from { transform: scaleX(.85); opacity: 0; } }
.ghost {
  position: fixed; z-index: 50; pointer-events: none; display: grid; place-items: center; text-align: center;
  background: var(--tile); color: var(--ink); border-radius: 12px; padding: 0 .4em; line-height: 1.1;
  box-shadow: 0 14px 30px rgba(0,0,0,.4), 0 4px 0 var(--gold-edge);
  font-family: var(--font-ui); font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
  transform: translate(-50%, -50%) scale(1.08) rotate(-2deg);
}
.ghost .pic { line-height: 1; letter-spacing: 0; }

.tools { display: flex; justify-content: center; gap: 22px; padding-top: 6px; }
.tool-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.tool {
  position: relative; width: 64px; height: 64px; border: 0; border-radius: 50%; display: grid; place-items: center; font-size: 28px;
  background: radial-gradient(circle at 50% 35%, #FFFFFF 0%, var(--tile) 70%); box-shadow: 0 5px 0 var(--tile-edge), 0 8px 14px rgba(0,0,0,.25);
}
.tool:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--tile-edge); }
.tool:disabled { opacity: .45; cursor: default; }
.tool .n {
  position: absolute; bottom: -6px; right: -8px; min-width: 26px; height: 26px; border-radius: 13px; padding: 0 7px;
  background: var(--gold); color: var(--ink); font-size: .85rem; font-weight: 700; display: grid; place-items: center; box-shadow: 0 2px 0 var(--gold-edge);
}
.tool-label { font-size: .78rem; color: var(--muted); font-weight: 600; letter-spacing: .04em; }

/* ---------- Wall ---------- */
.wall-stage { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; }
.wall {
  width: min(100cqw, 128cqh); aspect-ratio: 1.6; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
  gap: 1.8%; container-type: inline-size; padding: 1.6%; border-radius: 2.4cqw; background: var(--tray);
  box-shadow: inset 0 0.4cqw 1.6cqw rgba(0,0,0,.35);
}
.wtile {
  border: 0; border-radius: 1.4cqw; color: var(--ink); background: linear-gradient(180deg, #FFFDF7 0%, var(--tile) 55%);
  box-shadow: 0 0.55cqw 0 var(--tile-edge), 0 0.9cqw 1.2cqw rgba(0,0,0,.18);
  font-weight: 600; font-size: 3cqw; line-height: 1.1; padding: 0 .4em; min-width: 0; transition: background .2s, color .2s, transform .12s;
}
.wtile.sel { transform: translateY(-0.5cqw); box-shadow: 0 1cqw 0 var(--gold-edge), 0 0 0 0.45cqw var(--gold); }
.wtile.found {
  color: #fff; text-shadow: 0 0.15cqw 0 rgba(0,0,0,.25); cursor: default; animation: pop .4s ease-out;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 72%, #fff) 0%, var(--c) 62%); box-shadow: 0 0.55cqw 0 color-mix(in srgb, var(--c) 55%, #000);
}
.wtile.revealed { filter: saturate(.45) brightness(.85); }
@keyframes pop { 40% { transform: scale(1.07); } }
.wall.shake { animation: shake .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
.lives { display: flex; gap: 6px; align-items: center; font-weight: 600; color: var(--muted); }
.lives .heart { width: 24px; height: 24px; }
.lives .heart path { fill: var(--danger); }
.lives .heart.gone path { fill: rgba(255,255,255,.18); }

/* ---------- Overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(2, 16, 15, .6); display: grid; place-items: center; padding: 16px; animation: fade .25s; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  background: var(--tile); color: var(--ink); border-radius: 24px; padding: 24px; width: min(560px, 100%);
  max-height: calc(100% - 32px); overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 8px 0 var(--tile-edge), 0 30px 60px rgba(0,0,0,.4); animation: rise .4s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes rise { from { transform: translateY(30px) scale(.96); opacity: 0; } }
.sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: 2.1rem; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.sheet p { margin: 0; color: #6F5F4E; line-height: 1.45; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { background: #F3E7D1; border-radius: 14px; padding: 10px 14px; min-width: 96px; }
.stat b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .74rem; color: #8A7A66; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 14px; padding: 12px 20px; font-weight: 700; background: #EFE3CC; color: var(--ink); box-shadow: 0 3px 0 var(--tile-edge); }
.btn.primary { background: var(--gold); box-shadow: 0 3px 0 var(--gold-edge); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--tile-edge); }
.conn { display: grid; grid-template-columns: 10px 1fr auto; gap: 4px 12px; align-items: center; background: #F3E7D1; border-radius: 14px; padding: 10px 12px; }
.conn .sw { grid-row: 1 / span 2; width: 10px; align-self: stretch; border-radius: 5px; background: var(--c); }
.conn .name, .conn .words { grid-column: 2; min-width: 0; }
.conn .ctl { grid-column: 3; grid-row: 1 / span 2; }
.conn .words { font-size: .82rem; color: #8A7A66; text-transform: uppercase; letter-spacing: .04em; }
.conn .name { font-weight: 700; }
.conn .name.hidden { color: #8A7A66; font-weight: 500; font-style: italic; }
.pill-btn { border: 0; border-radius: 99px; padding: 8px 12px; font-size: .82rem; font-weight: 700; background: #fff; color: var(--ink); box-shadow: 0 2px 0 var(--tile-edge); }
.pill-btn.on { background: #2FA866; color: #fff; box-shadow: 0 2px 0 #1E6E43; }
.toast {
  position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  background: var(--tile); color: var(--ink); padding: 11px 20px; border-radius: 99px; font-weight: 600; z-index: 70;
  box-shadow: 0 4px 0 var(--tile-edge), 0 10px 24px rgba(0,0,0,.3); animation: fade .2s; max-width: calc(100% - 48px); text-align: center;
}
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 65; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
@media (max-width: 600px) {
  .board { width: min(100cqw, 80cqh); aspect-ratio: .8; gap: 1.6% 1.8%; }
  .tile { font-size: 2.75cqw; letter-spacing: 0; padding: 0 .15em; }
  .tile .pic { font-size: 6.5cqw; }
  .band span { font-size: 2.3cqw; top: -0.5cqw; }
  .wall { width: min(100cqw, 100cqh); aspect-ratio: 1; }
  .wtile { font-size: 4.2cqw; }
  .tool { width: 54px; height: 54px; font-size: 24px; }
  .timer { font-size: 1.05rem; }
  .logo b { font-size: 1.15rem; }
}
</style>

<body>
<div class="app" id="app"></div>
<script src="puzzles.js"></script>
<script>
const GROUP_COLOURS = ["#E8553D", "#3D6FE8", "#2FA866", "#D93A87", "#E09A12", "#14A3B8", "#8A55E6", "#7DA22A", "#C9562C", "#2E86DE", "#B8458F", "#5B6CFF", "#1E9E8A", "#D9662B", "#6C7A89"];
const WALL_COLOURS = ["#2E5FA8", "#2E8F5A", "#16857F", "#A63A4A"];
const COLS = 5, ROWS = 7, SIZE = COLS * ROWS;

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const fmt = s => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function parseTile(raw) {
  const i = raw.indexOf("|");
  return i > 0 ? { pic: raw.slice(0, i), label: raw.slice(i + 1) } : { pic: null, label: raw };
}
function tileFace(t) { return t.pic ? `<span class="pic" role="img" aria-label="${esc(t.label)}">${t.pic}</span>` : esc(t.label); }
let toastTimer;
function toast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2600);
}
const store = {
  get() { try { return JSON.parse(localStorage.getItem("linkboard-v2")) || {}; } catch { return {}; } },
  set(k, v) { try { const d = store.get(); d[k] = v; localStorage.setItem("linkboard-v2", JSON.stringify(d)); } catch {} },
};
const ICONS = {

/* ---------- timer (shared) ---------- */
let tickHandle = null, lastTick = 0, onTick = null;

/* ---------- confetti ---------- */

  const ctx = c.getContext("2d"), dpr = devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const bits = Array.from({ length: 140 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .45, vx: (Math.random() - .5) * 14, vy: -Math.random() * 16 - 4,
    r: Math.random() * Math.PI, vr: (Math.random() - .5) * .4, w: 7 + Math.random() * 7, h: 4 + Math.random() * 4, col: pick(GROUP_COLOURS.concat(["#F4C04E", "#FFF7E8"])),
  }));

}

/* =====================================================================
   BOARD MODE
   Groups nest: a found group shrinks into one picture tile, which belongs
   to the group above it. Top-level groups lock in place as coloured rows.
   ===================================================================== */
let B = null;

function buildLevel(level) {
  const groups = [], tiles = [];
  function addGroup(spec, parent) {
    const g = { id: groups.length, name: spec.name, pic: spec.pic || null, parent, memberTiles: [], subs: [] };
    groups.push(g);
    spec.tiles.forEach(t => {
      if (typeof t === "object") { const s = addGroup(t, g.id); g.subs.push(s.id); g.memberTiles.push(s); }
      else { const tile = { id: tiles.length, ...parseTile(t), parent: g.id, symbolOf: null }; tiles.push(tile); g.memberTiles.push(tile.id); }
    });
    return g;
  }
  level.groups.forEach(s => addGroup(s, null));
  // Each sub-group gets a picture tile, which only appears once the group is found.
  groups.forEach(g => {
    if (g.parent != null) { const t = { id: tiles.length, label: g.name, pic: g.pic, parent: g.parent, symbolOf: g.id }; tiles.push(t); g.symbolTile = t.id; }
  });
  groups.forEach(g => g.memberTiles = g.memberTiles.map(m => typeof m === "object" ? m.symbolTile : m));
  // Colours: top groups first so they stay distinct on the board.
  let ci = 0;
  groups.filter(g => g.parent == null).forEach(g => g.colour = GROUP_COLOURS[ci++ % GROUP_COLOURS.length]);
  groups.filter(g => g.parent != null).forEach(g => g.colour = GROUP_COLOURS[ci++ % GROUP_COLOURS.length]);
  return { groups, tiles };
}

function startBoard(levelIdx) {
  const level = BOARD_LEVELS[levelIdx];
  const { groups, tiles } = buildLevel(level);
  B = {
    levelIdx, level, groups, tiles, board: new Array(SIZE).fill(null), locked: new Map(), solved: new Set(),
    pool: tiles.filter(t => t.symbolOf == null).map(t => t.id),
    timed: !!level.time, timeLeft: level.time || 0, elapsed: 0, frozenUntil: 0,
    hints: 3, freezes: level.time ? 2 : 0, busy: false, sel: null, completing: null, hint: null, anim: {}, over: false,
  };
  // Opening deal: two complete word groups plus a random mix, so there is always something to find.
  const wordGroups = shuffle(groups.filter(g => g.memberTiles.every(t => tiles[t].symbolOf == null)));
  const deal = [...wordGroups[0].memberTiles, ...(wordGroups[1] ? wordGroups[1].memberTiles : [])];
  B.pool = shuffle(B.pool.filter(t => !deal.includes(t)));
  while (deal.length < SIZE && B.pool.length) deal.push(B.pool.pop());
  shuffle(deal).forEach((id, i) => B.board[i] = id);
  breakCompleteRows();
  renderBoardScreen();
  startTicking(boardTick);
}

const T = id => B.tiles[id];
const rowOf = i => Math.floor(i / COLS);
const isLocked = i => B.locked.has(rowOf(i)) || (B.completing && B.completing.some(c => c.row === rowOf(i)));
function rowIds(r) { return B.board.slice(r * COLS, r * COLS + COLS); }
function rowComplete(r) {
  if (B.locked.has(r)) return null;
  const ids = rowIds(r);
  if (ids.some(x => x == null)) return null;
  const p = T(ids[0]).parent;
  return ids.every(x => T(x).parent === p) && !B.solved.has(p) ? p : null;
}
const playable = () => B.board.map((_, i) => i).filter(i => !B.locked.has(rowOf(i)));
// Make sure no row is solved by luck after a deal or refill.
function breakCompleteRows() {
  for (let guard = 0; guard < 100; guard++) {
    const r = [...Array(ROWS).keys()].find(r => rowComplete(r) != null);
    if (r == null) return;
    const a = r * COLS + Math.floor(Math.random() * COLS);
    const others = playable().filter(i => rowOf(i) !== r && (B.board[i] == null || T(B.board[i]).parent !== T(B.board[a]).parent));
    if (!others.length) return;
    const b = pick(others);
    [B.board[a], B.board[b]] = [B.board[b], B.board[a]];
  }
}
// Fill empty slots from the hidden stack, always leaving at least one group that can be completed.
function refill() {
  const onBoard = new Set(B.board.filter(x => x != null));
  const open = B.groups.filter(g => !B.solved.has(g.id));
  const completable = open.some(g => g.memberTiles.every(t => onBoard.has(t)));
  let empties = playable().filter(i => B.board[i] == null);
  const incoming = [];
  if (!completable) {
    const inPool = new Set(B.pool);
    const ready = open.filter(g => g.memberTiles.every(t => onBoard.has(t) || inPool.has(t)));
    ready.sort((a, b) => a.memberTiles.filter(t => !onBoard.has(t)).length - b.memberTiles.filter(t => !onBoard.has(t)).length);
    const g = ready[0];
    if (g) {
      const missing = g.memberTiles.filter(t => !onBoard.has(t));
      // Not enough room? Quietly send some unrelated words back to the stack.
      while (missing.length > empties.length) {
        const cands = playable().filter(i => B.board[i] != null && T(B.board[i]).symbolOf == null && T(B.board[i]).parent !== g.id);
        if (!cands.length) break;
        const i = pick(cands); B.pool.push(B.board[i]); B.board[i] = null; empties.push(i);
      }
      incoming.push(...missing);
      B.pool = B.pool.filter(t => !missing.includes(t));
    }
  }
  shuffle(B.pool);
  while (incoming.length < empties.length && B.pool.length) incoming.push(B.pool.pop());
  shuffle(empties);
  incoming.forEach((id, k) => { B.board[empties[k]] = id; B.anim[id] = "drop"; });

}

function boardTick(dt, now) {
  if (!B || B.over) return;
  const frozen = now < B.frozenUntil;
  const t = $("#timer");
  if (B.timed) {
    if (!frozen) B.timeLeft -= dt;
    if (t) {
      t.querySelector(".t").textContent = fmt(Math.ceil(B.timeLeft));
      t.classList.toggle("frozen", frozen);
      t.classList.toggle("low", !frozen && B.timeLeft <= 30);
    }
    if (B.timeLeft <= 0) endBoard(false);
  } else {
    B.elapsed += dt;
    if (t) t.querySelector(".t").textContent = fmt(B.elapsed);
  }
}

function renderBoardScreen() {
  const L = B.level;
  app.innerHTML = `
  <div class="screen">
    <div class="bar">
      <button class="icon-btn" id="back" aria-label="Back to menu">${ICONS.back}</button>

      <div class="timer ${B.timed ? "" : "relaxed"}" id="timer" aria-label="${B.timed ? "Time left" : "Time taken"}"><span class="dial">${B.timed ? ICONS.clock : ICONS.leaf}</span><span class="t">${fmt(B.timed ? B.timeLeft : 0)}</span></div>
    </div>
    <div class="sub">
      <span class="hint-text">Put five connected tiles in one row</span>
      <span class="counter" aria-label="Groups found"><span class="stack"><i></i><i></i><i></i></span><span id="count"></span></span>
    </div>
    <div class="stage"><div class="board" id="board"></div></div>

      <div class="tool-wrap"><button class="tool" id="shuffleBtn" aria-label="Shuffle the board">🔀</button><span class="tool-label">Shuffle</span></div>

    const slots = playable().filter(i => B.board[i] != null);
    const ids = shuffle(slots.map(i => B.board[i]));
    slots.forEach((s, k) => B.board[s] = ids[k]);

function renderBoard() {
  const el = $("#board"); if (!el) return;
  let html = "";
  const bandRows = new Map(B.locked);
  (B.completing || []).forEach(c => bandRows.set(c.row, c.group));
  bandRows.forEach((gid, row) => {
    const g = B.groups[gid];
    html += `<div class="band" style="grid-row:${row + 1};--c:${g.colour}"><span>${esc(g.name)}</span></div>`;
  });
  for (let i = 0; i < SIZE; i++) {
    const id = B.board[i], r = rowOf(i), c = i % COLS;
    const pos = `grid-row:${r + 1};grid-column:${c + 1}`;
    if (id == null) { html += `<div class="slot empty" data-i="${i}" style="${pos}"></div>`; continue; }
    const t = T(id);
    const cls = [];
    let style = "";
    if (t.symbolOf != null) cls.push("symbol");
    if (B.sel === i) cls.push("sel");
    if (bandRows.has(r)) { cls.push("grouped"); style = `--c:${B.groups[bandRows.get(r)].colour}`; }
    if (B.hint != null && t.parent === B.hint && !bandRows.has(r)) cls.push("hinted");
    if (B.anim[id]) cls.push(B.anim[id]);
    if (B.completing && B.completing.some(cc => cc.row === r)) cls.push("flash");
    html += `<div class="slot" data-i="${i}" style="${pos}"><div class="tile ${cls.join(" ")}" style="${style}" data-i="${i}" tabindex="0" aria-label="${esc(t.label)}">${tileFace(t)}</div></div>`;
  }
  el.innerHTML = html;
  B.anim = {};
  $("#count").textContent = `${B.solved.size}/${B.groups.length}`;
  $("#hintN").textContent = B.hints; $("#hintBtn").disabled = !B.hints;
  if (B.timed) { $("#freezeN").textContent = B.freezes; $("#freezeBtn").disabled = !B.freezes; }
}

function swapSlots(a, b) {
  if (a === b || B.busy || B.over || isLocked(a) || isLocked(b)) return;
  [B.board[a], B.board[b]] = [B.board[b], B.board[a]];
  B.sel = null;
  const done = [];
  for (let r = 0; r < ROWS; r++) { const g = rowComplete(r); if (g != null) done.push({ row: r, group: g }); }
  if (!done.length) return renderBoard();
  B.busy = true; B.completing = done;
  if (done.some(d => d.group === B.hint)) B.hint = null;
  renderBoard();
  const cur = B;
  setTimeout(() => { if (B === cur) resolveRows(done); }, 1000);
}

function resolveRows(done) {
  const subs = done.filter(d => B.groups[d.group].parent != null);
  // Sub-groups: tiles slide together and shrink into the group's picture.
  subs.forEach(d => {
    for (let c = 0; c < COLS; c++) {
      const tile = $(`#board .tile[data-i="${d.row * COLS + c}"]`);
      if (tile) { tile.style.setProperty("--dx", `${(2 - c) * 106}%`); tile.classList.add("squish"); }
    }
  });
  const cur = B;
  setTimeout(() => {
    if (B !== cur) return;
    done.forEach(d => {
      const g = B.groups[d.group];
      B.solved.add(g.id);
      if (g.parent == null) { B.locked.set(d.row, g.id); return; }
      for (let c = 0; c < COLS; c++) B.board[d.row * COLS + c] = null;
      B.board[d.row * COLS + 2] = g.symbolTile;
      B.anim[g.symbolTile] = "born";
      toast(`${g.pic} ${g.name}`);
    });
    B.completing = null;
    if (B.solved.size === B.groups.length) { B.busy = false; renderBoard(); return setTimeout(() => { if (B === cur) endBoard(true); }, 500); }
    const born = { ...B.anim };
    refill();
    B.anim = { ...B.anim, ...born };
    B.busy = false;
    renderBoard();
    const top = done.find(d => B.groups[d.group].parent == null);
    if (top) toast(`${B.groups[top.group].name} complete!`);
  }, subs.length ? 400 : 0);
}

function useHint() {
  if (!B.hints || B.busy || B.over) return;
  const onBoard = new Set(B.board.filter(x => x != null));
  const full = B.groups.filter(g => !B.solved.has(g.id) && g.memberTiles.every(t => onBoard.has(t))).map(g => g.id);
  if (!full.length) return;
  const g = full.includes(B.hint) ? B.hint : pick(full);

}

  B.freezes--; B.frozenUntil = Math.max(performance.now(), B.frozenUntil) + 30000;
  toast("Clock frozen for 30 seconds");
  renderBoard();
}

function endBoard(won) {

  B.over = true; stopTicking();
  const key = "board-" + B.levelIdx;
  const score = B.timed ? Math.ceil(B.timeLeft) : Math.floor(B.elapsed);
  if (won) {
    const prev = store.get()[key];
    if (!prev || (B.timed ? score > prev : score < prev)) store.set(key, score);
    confetti();
  }
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">
    <h2>${won ? "Board complete!" : "Time's up"}</h2>
    <p>${won ? `You found all ${B.groups.length} connections.` : `You found ${B.solved.size} of ${B.groups.length} connections. Have another go?`}</p>
    <div class="stats">
      <div class="stat"><b>${B.solved.size}/${B.groups.length}</b><span>Connections</span></div>
      <div class="stat"><b>${B.timed ? fmt(won ? B.timeLeft : 0) : fmt(B.elapsed)}</b><span>${B.timed ? "Time to spare" : "Time taken"}</span></div>
      <div class="stat"><b>${3 - B.hints}</b><span>Hints used</span></div>
    </div>
    <div class="actions"><button class="btn primary" id="again">Play again</button><button class="btn" id="menu">Back to menu</button></div>
  </div>`;
  document.body.appendChild(ov);
  const lvl = B.levelIdx;
  $("#again", ov).onclick = () => { ov.remove(); startBoard(lvl); };
  $("#menu", ov).onclick = () => { ov.remove(); showHome(); };
}

/* Drag and drop, plus tap one tile then tap another to swap. */
function bindDrag(board) {
  let drag = null;
  const slotAt = (x, y) => { const el = document.elementFromPoint(x, y); const s = el && el.closest(".slot"); return s && board.contains(s) ? +s.dataset.i : null; };
  board.addEventListener("pointerdown", e => {
    const tile = e.target.closest(".tile");
    if (!tile || B.busy || B.over) return;
    const i = +tile.dataset.i;
    if (isLocked(i)) return;
    drag = { i, x: e.clientX, y: e.clientY, moved: false, tile, ghost: null, target: null, pid: e.pointerId };
    try { board.setPointerCapture(e.pointerId); } catch {}
  });
  board.addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== drag.pid) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) {
      drag.moved = true;
      const r = drag.tile.getBoundingClientRect();
      const g = document.createElement("div"); g.className = "ghost";
      g.style.width = r.width + "px"; g.style.height = r.height + "px";
      g.style.fontSize = getComputedStyle(drag.tile).fontSize; g.innerHTML = drag.tile.innerHTML;
      const pic = g.querySelector(".pic"); if (pic) pic.style.fontSize = getComputedStyle(drag.tile.querySelector(".pic")).fontSize;
      document.body.appendChild(g); drag.ghost = g;
      drag.tile.classList.add("lifted"); B.sel = null;
      board.querySelectorAll(".tile.sel").forEach(t => t.classList.remove("sel"));
    }
    if (drag.moved) {
      drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px";
      const t = slotAt(e.clientX, e.clientY);
      if (t !== drag.target) {
        board.querySelectorAll(".slot.target").forEach(s => s.classList.remove("target"));
        drag.target = t;
        if (t != null && t !== drag.i && !isLocked(t)) board.querySelector(`.slot[data-i="${t}"]`).classList.add("target");
      }
    }
  });
  const finish = e => {
    if (!drag || e.pointerId !== drag.pid) return;
    const d = drag; drag = null;
    if (d.ghost) d.ghost.remove();
    if (d.moved) {
      d.tile.classList.remove("lifted");
      board.querySelectorAll(".slot.target").forEach(s => s.classList.remove("target"));
      if (e.type === "pointerup" && d.target != null && d.target !== d.i && !isLocked(d.target)) swapSlots(d.i, d.target);
      return;
    }
    if (e.type !== "pointerup") return;
    if (B.sel == null) { B.sel = d.i; renderBoard(); }
    else if (B.sel === d.i) { B.sel = null; renderBoard(); }
    else swapSlots(B.sel, d.i);
  };
  board.addEventListener("pointerup", finish);
  board.addEventListener("pointercancel", finish);
  // Tapping an empty slot while a tile is selected moves it there.
  board.addEventListener("click", e => {
    const s = e.target.closest(".slot.empty");
    if (s && B.sel != null) swapSlots(B.sel, +s.dataset.i);
  });
  board.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("tile")) {
      e.preventDefault(); const i = +e.target.dataset.i;
      if (isLocked(i)) return;
      if (B.sel == null) B.sel = i; else if (B.sel === i) B.sel = null; else return swapSlots(B.sel, i);
      renderBoard(); board.querySelector(`.tile[data-i="${i}"]`)?.focus();
    }
  });
}

/* =====================================================================
   WALL MODE (Only Connect style)
   ===================================================================== */
let W = null;

function startWall(idx) {
  const wall = WALLS[idx];
  const clues = [];
  wall.groups.forEach((g, gi) => g.tiles.forEach(text => clues.push({ id: clues.length, group: gi, text })));
  W = { idx, wall, clues, order: shuffle(clues.map(c => c.id)), found: [], sel: [], lives: null,
        timeLeft: 180, over: false, busy: false, revealed: new Set(), credited: new Set(), endReason: "" };
  renderWallScreen();
  startTicking(wallTick);
}

function wallTick(dt) {
  if (!W || W.over) return;
  W.timeLeft -= dt;
  const t = $("#timer");
  if (t) { t.querySelector(".t").textContent = fmt(Math.ceil(W.timeLeft)); t.classList.toggle("low", W.timeLeft <= 30); }
  if (W.timeLeft <= 0) endWall("Time's up");
}

function renderWallScreen() {
  app.innerHTML = `
  <div class="screen">
    <div class="bar">
      <button class="icon-btn" id="back" aria-label="Back to menu">${ICONS.back}</button>
      <div class="title-block"><div class="lvl">${esc(W.wall.name)}</div><span class="chip" style="--c:${WALL_COLOURS[0]}">Wall</span></div>
      <div class="timer" id="timer"><span class="dial">${ICONS.clock}</span><span class="t">${fmt(W.timeLeft)}</span></div>
    </div>
    <div class="sub"><span class="hint-text" id="wallMsg"></span><span class="lives" id="lives"></span></div>
    <div class="wall-stage"><div class="wall" id="wall"></div></div>
  </div>`;
  $("#back").onclick = showHome;
  $("#wall").addEventListener("click", e => { const b = e.target.closest(".wtile"); if (b) tapClue(+b.dataset.id); });
  renderWall();
}

function renderWall() {
  const el = $("#wall"); if (!el) return;
  const foundIds = W.found.flatMap(g => W.clues.filter(c => c.group === g).map(c => c.id));
  const rest = W.order.filter(id => !foundIds.includes(id));
  let html = "";
  W.found.forEach((g, k) => W.clues.filter(c => c.group === g).forEach(c => {
    const auto = W.revealedGroups && W.revealedGroups.includes(g);
    html += `<button class="wtile found ${auto ? "revealed" : ""}" style="--c:${WALL_COLOURS[k]}" data-id="${c.id}" aria-disabled="true">${esc(c.text)}</button>`;
  }));
  rest.forEach(id => html += `<button class="wtile ${W.sel.includes(id) ? "sel" : ""}" data-id="${id}" aria-pressed="${W.sel.includes(id)}">${esc(W.clues[id].text)}</button>`);
  el.innerHTML = html;
  const msg = $("#wallMsg");
  if (W.over) msg.textContent = W.endReason;
  else if (W.lives == null) msg.textContent = `Pick four clues that connect. ${W.found.length} of 4 groups found.`;
  else msg.textContent = "Careful now, every wrong guess costs a life.";
  $("#lives").innerHTML = W.lives == null ? "" : `Lives ${[0, 1, 2].map(i => ICONS.heart.replace('class="heart"', `class="heart ${i < W.lives ? "" : "gone"}"`)).join("")}`;
}

function tapClue(id) {
  if (W.over || W.busy) return;
  if (W.found.includes(W.clues[id].group)) return;
  const i = W.sel.indexOf(id);
  if (i >= 0) W.sel.splice(i, 1); else W.sel.push(id);
  if (W.sel.length < 4) return renderWall();
  const g = W.clues[W.sel[0]].group;
  if (W.sel.every(x => W.clues[x].group === g)) {
    W.found.push(g); W.sel = [];
    if (W.found.length === 2 && W.lives == null) { W.lives = 3; toast("Two groups found. You now have three lives."); }
    if (W.found.length === 3) {
      const last = [0, 1, 2, 3].find(x => !W.found.includes(x));
      W.found.push(last);
      renderWall();
      return endWall("Wall solved!");
    }
    renderWall();
  } else {
    W.busy = true; renderWall();
    const el = $("#wall"); el.classList.add("shake");
    if (W.lives != null) W.lives--;
    const cur = W;
    setTimeout(() => {
      if (W !== cur) return;
      el.classList.remove("shake"); W.sel = []; W.busy = false;
      if (W.lives === 0) { renderWall(); endWall("Out of lives"); } else renderWall();
    }, 480);
  }
}

function endWall(reason) {
  if (W.over) return;
  W.over = true; W.endReason = reason; stopTicking();
  W.groupsScored = W.found.length;
  W.revealedGroups = [0, 1, 2, 3].filter(g => !W.found.includes(g));
  W.found.push(...W.revealedGroups); W.sel = [];
  renderWall();
  if (W.groupsScored === 4) confetti();
  const cur = W;
  setTimeout(() => { if (W === cur) showWallResults(); }, 900);
}

function wallScore() {
  const conns = W.credited.size;
  return W.groupsScored + conns + (W.groupsScored === 4 && conns === 4 ? 2 : 0);
}

function showWallResults() {
  const ov = document.createElement("div"); ov.className = "overlay";
  const save = () => { const k = "wall-" + W.idx, prev = store.get()[k]; if (prev == null || wallScore() > prev) store.set(k, wallScore()); };
  const draw = () => {
    ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">
      <h2>${esc(W.endReason)}</h2>
      <p>You score a point for each group found. Now, did you know the connections? Reveal each one and give yourself a point if you had it. Get everything for a 2 point bonus.</p>
      ${W.found.map((g, k) => {
        const words = W.clues.filter(c => c.group === g).map(c => c.text).join(", ");
        const shown = W.revealed.has(g);
        return `<div class="conn" style="--c:${WALL_COLOURS[k]}"><span class="sw"></span>
          <span class="name ${shown ? "" : "hidden"}">${shown ? esc(W.wall.groups[g].name) : "Connection hidden"}</span>
          <span class="ctl">${shown ? `<button class="pill-btn ${W.credited.has(g) ? "on" : ""}" data-credit="${g}">${W.credited.has(g) ? "Got it ✓" : "I had it"}</button>` : `<button class="pill-btn" data-reveal="${g}">Reveal</button>`}</span>
          <span class="words">${esc(words)}</span></div>`;
      }).join("")}
      <div class="stats">
        <div class="stat"><b>${W.groupsScored}</b><span>Groups</span></div>
        <div class="stat"><b>${W.credited.size}</b><span>Connections</span></div>
        <div class="stat"><b>${wallScore()}</b><span>Total / 10</span></div>
      </div>
      <div class="actions"><button class="btn primary" id="again">Play again</button><button class="btn" id="menu">Back to menu</button></div>
    </div>`;
    ov.querySelectorAll("[data-reveal]").forEach(b => b.onclick = () => { W.revealed.add(+b.dataset.reveal); draw(); });
    ov.querySelectorAll("[data-credit]").forEach(b => b.onclick = () => { const g = +b.dataset.credit; W.credited.has(g) ? W.credited.delete(g) : W.credited.add(g); draw(); });
    $("#again", ov).onclick = () => { save(); ov.remove(); startWall(W.idx); };
    $("#menu", ov).onclick = () => { save(); ov.remove(); showHome(); };
  };
  draw();
  document.body.appendChild(ov);
}

showHome();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
